<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & Tags" subtitle="Product badges, status tags, label chips" viewport="700x200" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px 20px; background: #fff; font-family: var(--font-sans); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.label { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); margin-bottom: 7px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; font-style: italic; }
.tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
</style>
</head><body>
<div class="label">Product Badges</div>
<div class="row">
  <span class="badge" style="background:#fdecea;color:#da291c">neoTextil</span>
  <span class="badge" style="background:#e6f2fc;color:#0072ce">neoStampa</span>
  <span class="badge" style="background:#eaf5e5;color:#509e2f">neoCatalog</span>
</div>
<div class="label">Status Tags</div>
<div class="row">
  <span class="tag" style="background:#eaf5e5;color:#509e2f;gap:6px"><span class="dot" style="background:#509e2f"></span>Active</span>
  <span class="tag" style="background:#fff8e1;color:#d97706;gap:6px"><span class="dot" style="background:#d97706"></span>Trial</span>
  <span class="tag" style="background:#fdecea;color:#da291c;gap:6px"><span class="dot" style="background:#da291c"></span>Expired</span>
  <span class="tag" style="background:#f4f4f4;color:#888b8d;gap:6px"><span class="dot" style="background:#888b8d"></span>Inactive</span>
</div>
<div class="label">Label Chips</div>
<div class="row">
  <span class="badge" style="background:#2e3032;color:#fff;font-style:normal">NEW</span>
  <span class="badge" style="background:#fe5000;color:#fff;font-style:normal">FEATURED</span>
  <span class="badge" style="background:transparent;border:1px solid #d5d6d7;color:#888b8d;font-style:normal">v9.0</span>
  <span class="badge" style="background:transparent;border:1px solid #0072ce;color:#0072ce;font-style:normal">BETA</span>
</div>
</body></html>

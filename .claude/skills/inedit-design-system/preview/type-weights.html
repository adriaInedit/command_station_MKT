<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type Weights" subtitle="All 8 weights — Thin through Ultra" viewport="700x260" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px 20px; background: #fff; font-family: var(--font-sans); }
.row { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border-light); }
.wlabel { font-size: 9px; color: var(--fg3); width: 80px; flex-shrink: 0; letter-spacing: 0.04em; }
.sample { font-size: 22px; color: var(--fg1); }
</style>
</head><body>
<div class="row"><div class="wlabel">100 Thin</div><div class="sample" style="font-weight:100">Soho Gothic Pro Thin</div></div>
<div class="row"><div class="wlabel">300 Light</div><div class="sample" style="font-weight:300">Soho Gothic Pro Light</div></div>
<div class="row"><div class="wlabel">400 Regular</div><div class="sample" style="font-weight:400">Soho Gothic Pro Regular</div></div>
<div class="row"><div class="wlabel">500 Medium</div><div class="sample" style="font-weight:500">Soho Gothic Pro Medium</div></div>
<div class="row"><div class="wlabel">700 Bold</div><div class="sample" style="font-weight:700">Soho Gothic Pro Bold</div></div>
<div class="row"><div class="wlabel">800 ExtraBold</div><div class="sample" style="font-weight:800">Soho Gothic Pro ExtraBold</div></div>
<div class="row"><div class="wlabel">900 Ultra</div><div class="sample" style="font-weight:900">Soho Gothic Pro Ultra</div></div>
<div class="row"><div class="wlabel">700 Bold Italic</div><div class="sample" style="font-weight:700;font-style:italic">Soho Gothic Pro Bold Italic</div></div>

<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand Orange Scale" subtitle="Primary orange palette — #E84020 base" viewport="700x160" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px; background: #fff; font-family: var(--font-sans); }
.row { display: flex; gap: 8px; }
.swatch { flex: 1; border-radius: 4px; height: 72px; display: flex; align-items: flex-end; padding: 6px 8px; }
.swatch span { font-size: 10px; font-weight: 500; color: #fff; mix-blend-mode: difference; opacity: 0.9; }
.label { font-size: 10px; font-weight: 600; color: var(--fg2); margin: 10px 0 4px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head><body>
<div class="label">Orange Scale</div>
<div class="row">
  <div class="swatch" style="background:#fff4ee"><span style="color:#aaa">50</span></div>
  <div class="swatch" style="background:#ffe2cc"><span style="color:#aaa">100</span></div>
  <div class="swatch" style="background:#ffc299"><span style="color:#888">200</span></div>
  <div class="swatch" style="background:#ff9a66"><span>300</span></div>
  <div class="swatch" style="background:#ff7333"><span>400</span></div>
  <div class="swatch" style="background:#fe5000; outline: 3px solid #fe5000; outline-offset:2px"><span>500 ★</span></div>
  <div class="swatch" style="background:#d44200"><span>600</span></div>
  <div class="swatch" style="background:#aa3400"><span>700</span></div>
  <div class="swatch" style="background:#802700"><span>800</span></div>
  <div class="swatch" style="background:#561a00"><span>900</span></div>
</div>
<div style="margin-top:10px;display:flex;gap:16px;align-items:center">
  <div style="display:flex;align-items:center;gap:6px">
    <div style="width:32px;height:32px;border-radius:50%;background:#fe5000"></div>
    <div><div style="font-size:11px;font-weight:700;color:#2e3032">#FE5000</div><div style="font-size:10px;color:#888b8d">Primary Orange</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div style="width:32px;height:32px;border-radius:50%;background:#d44200"></div>
    <div><div style="font-size:11px;font-weight:700;color:#2e3032">#D44200</div><div style="font-size:10px;color:#888b8d">Hover / Pressed</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px;margin-left:auto;padding:6px 12px;background:#fe5000;border-radius:99px">
    <div style="font-size:11px;font-weight:700;color:#fff;letter-spacing:0.03em">Pantone 165 C</div>
  </div>
</div>
</body></html>

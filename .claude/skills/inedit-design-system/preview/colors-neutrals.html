<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral Gray Scale" subtitle="Gray palette — logo gray #898989 + dark text" viewport="700x160" -->
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 16px; background: #fff; font-family: var(--font-sans); }
.row { display: flex; gap: 8px; }
.swatch { flex: 1; border-radius: 4px; height: 64px; display: flex; align-items: flex-end; padding: 5px 7px; border: 1px solid rgba(0,0,0,0.06); }
.swatch span { font-size: 10px; font-weight: 500; }
.label { font-size: 10px; font-weight: 600; color: #888b8d; margin: 10px 0 4px; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head><body>
<div class="label">Gray Scale</div>
<div class="row">
  <div class="swatch" style="background:#f7f7f8"><span style="color:#aaa">50</span></div>
  <div class="swatch" style="background:#ebebec"><span style="color:#aaa">100</span></div>
  <div class="swatch" style="background:#d5d6d7"><span style="color:#999">200</span></div>
  <div class="swatch" style="background:#b8babb"><span style="color:#888">300</span></div>
  <div class="swatch" style="background:#a0a3a5"><span style="color:#777">400</span></div>
  <div class="swatch" style="background:#888b8d; outline:3px solid #888b8d;outline-offset:2px"><span style="color:#fff">500 ★</span></div>
  <div class="swatch" style="background:#6b6e70"><span style="color:#ddd">600</span></div>
  <div class="swatch" style="background:#4e5052"><span style="color:#ccc">700</span></div>
  <div class="swatch" style="background:#2e3032"><span style="color:#ccc">800 ★</span></div>
  <div class="swatch" style="background:#1a1c1d"><span style="color:#ccc">900</span></div>
</div>
<div style="margin-top:10px;display:flex;gap:12px">
  <div style="display:flex;align-items:center;gap:6px">
    <div style="width:28px;height:28px;border-radius:4px;background:#888b8d"></div>
    <div><div style="font-size:10px;font-weight:700;color:#2e3032">#888B8D</div><div style="font-size:9px;color:#888b8d">Logo gray</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div style="width:28px;height:28px;border-radius:4px;background:#2e3032"></div>
    <div><div style="font-size:10px;font-weight:700;color:#2e3032">#2E3032</div><div style="font-size:9px;color:#888b8d">Primary text</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div style="width:28px;height:28px;border-radius:4px;background:#1a1c1d"></div>
    <div><div style="font-size:10px;font-weight:700;color:#2e3032">#1A1C1D</div><div style="font-size:9px;color:#888b8d">Dark footer</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div style="width:28px;height:28px;border-radius:4px;background:#fff;border:1px solid #d5d6d7"></div>
    <div><div style="font-size:10px;font-weight:700;color:#2e3032">#FFFFFF</div><div style="font-size:9px;color:#888b8d">Background</div></div>
  </div>
</div>
</body></html>

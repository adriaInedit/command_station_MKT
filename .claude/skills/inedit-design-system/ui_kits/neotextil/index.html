<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Neotextil" name="neoTextil UI Kit" subtitle="Photoshop plugin panel — repeat, colorways, export" viewport="1280x800" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>neoTextil — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Soho Gothic Pro','Helvetica Neue',Arial,sans-serif; background: #2c2c2c; color: #e0e0e0; height: 100vh; overflow: hidden; }
</style>
</head>
<body>
<div id="root" style="height:100vh;display:flex;flex-direction:column;overflow:hidden"></div>
<script type="text/babel">
const { useState } = React;

const C = { blue:'#da291c', blueHover:'#b81a10', bg:'#2c2c2c', panel:'#242424', sidebar:'#1e1e1e', border:'#3a3a3a', text:'#e0e0e0', muted:'#888', light:'#b0b0b0' };

/* Mock colorways */
const colorways = [
  { id:1, name:'Original', colors:['#c8a882','#8b6b4a','#e8d5b0','#5a3e28','#f2ece0'] },
  { id:2, name:'Navy & Gold', colors:['#1a2a4a','#c9a227','#d4c5a9','#0d1a2e','#f5f0e8'] },
  { id:3, name:'Forest', colors:['#2d4a2d','#6b8c5a','#c8d8b8','#1a2e1a','#eaf2e4'] },
  { id:4, name:'Coral Blush', colors:['#e87060','#f5b8a8','#fae8e0','#c84830','#fff5f0'] },
  { id:5, name:'Slate Mono', colors:['#3a4a5a','#6a7a8a','#b8c8d8','#1a2a3a','#e8f0f5'] },
];

const repeatModes = ['Full Drop','Half Drop','Half Brick','Mirror','Rotation'];

/* ─ Swatch ─ */
function Swatch({ color, size=18 }) {
  return <div style={{ width:size, height:size, borderRadius:3, background:color, border:'1px solid rgba(255,255,255,0.15)', flexShrink:0 }}/>;
}

/* ─ Plugin Panel ─ (main UI — simulates PS floating panel) */
function PluginPanel({ onNav }) {
  const [selColorway, setSelColorway] = useState(1);
  const [repeatMode, setRepeatMode] = useState('Half Drop');
  const [rapportW, setRapportW] = useState(30);
  const [rapportH, setRapportH] = useState(30);
  const [unit, setUnit] = useState('cm');
  const [view, setView] = useState('repeat');

  const tabs = [{ id:'repeat',label:'Repeat'},{id:'colorways',label:'Colorways'},{id:'export',label:'Export'}];

  return (
    <div style={{ width:260, background:C.panel, borderRadius:6, border:`1px solid ${C.border}`, overflow:'hidden', boxShadow:'0 8px 32px rgba(0,0,0,0.4)', display:'flex', flexDirection:'column', height:'100%' }}>
      {/* Header */}
      <div style={{ background:C.sidebar, padding:'10px 14px', borderBottom:`1px solid ${C.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
        <div style={{ display:'flex', alignItems:'center', gap:7 }}>
          <div style={{ width:22, height:22, borderRadius:4, background:C.blue, display:'flex', alignItems:'center', justifyContent:'center', fontSize:10, fontWeight:900, fontStyle:'italic', color:'#fff' }}>nT</div>
          <div>
            <div style={{ fontSize:12, fontWeight:700, color:'#fff' }}><span style={{ fontWeight:300 }}>neo</span>Textil</div>
            <div style={{ fontSize:8, color:C.muted, letterSpacing:'0.06em' }}>v7.4 for Photoshop</div>
          </div>
        </div>
        <div style={{ fontSize:10, color:C.muted }}>✕</div>
      </div>

      {/* Tabs */}
      <div style={{ display:'flex', background:C.sidebar, borderBottom:`1px solid ${C.border}` }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setView(t.id)}
            style={{ flex:1, padding:'8px 0', background:'none', border:'none', fontFamily:'inherit', fontSize:11, fontWeight:600, cursor:'pointer', color: view===t.id ? '#fff' : C.muted, borderBottom: view===t.id ? `2px solid ${C.blue}` : '2px solid transparent', transition:'all 150ms' }}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'14px' }}>

        {view==='repeat' && <>
          {/* Repeat mode */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', color:C.muted, marginBottom:7 }}>Repeat Mode</div>
            <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
              {repeatModes.map(m => (
                <label key={m} style={{ display:'flex', alignItems:'center', gap:8, cursor:'pointer', padding:'5px 8px', borderRadius:4, background: repeatMode===m ? `${C.blue}20` : 'transparent', border: repeatMode===m ? `1px solid ${C.blue}40` : '1px solid transparent' }}>
                  <input type="radio" name="repeat" checked={repeatMode===m} onChange={() => setRepeatMode(m)} style={{ accentColor:C.blue }}/>
                  <span style={{ fontSize:12, color: repeatMode===m ? '#fff' : C.light }}>{m}</span>
                </label>
              ))}
            </div>
          </div>

          {/* Rapport size */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', color:C.muted, marginBottom:7 }}>Rapport Size</div>
            <div style={{ display:'flex', gap:8, marginBottom:8 }}>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:C.muted, marginBottom:4 }}>Width</div>
                <input type="number" value={rapportW} onChange={e=>setRapportW(e.target.value)}
                  style={{ width:'100%', background:'#333', border:`1px solid ${C.border}`, borderRadius:4, padding:'6px 8px', fontFamily:'inherit', fontSize:13, color:'#fff', outline:'none' }}/>
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:10, color:C.muted, marginBottom:4 }}>Height</div>
                <input type="number" value={rapportH} onChange={e=>setRapportH(e.target.value)}
                  style={{ width:'100%', background:'#333', border:`1px solid ${C.border}`, borderRadius:4, padding:'6px 8px', fontFamily:'inherit', fontSize:13, color:'#fff', outline:'none' }}/>
              </div>
              <div>
                <div style={{ fontSize:10, color:C.muted, marginBottom:4 }}>Unit</div>
                <select value={unit} onChange={e=>setUnit(e.target.value)} style={{ background:'#333', border:`1px solid ${C.border}`, borderRadius:4, padding:'6px 8px', fontFamily:'inherit', fontSize:11, color:'#fff' }}>
                  <option>cm</option><option>mm</option><option>in</option><option>px</option>
                </select>
              </div>
            </div>
          </div>

          {/* Generate button */}
          <button style={{ width:'100%', fontFamily:'inherit', fontWeight:700, fontSize:12, padding:'9px', borderRadius:4, border:'none', background:C.blue, color:'#fff', cursor:'pointer', letterSpacing:'0.02em' }}>
            Generate Repeat
          </button>
        </>}

        {view==='colorways' && <>
          <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', color:C.muted, marginBottom:10 }}>Colorways</div>
          {colorways.map(cw => (
            <div key={cw.id} onClick={() => setSelColorway(cw.id)}
              style={{ display:'flex', alignItems:'center', gap:8, padding:'8px 10px', borderRadius:5, marginBottom:5, cursor:'pointer', background: selColorway===cw.id ? `${C.blue}20` : 'transparent', border: selColorway===cw.id ? `1px solid ${C.blue}40` : `1px solid ${C.border}` }}>
              <div style={{ display:'flex', gap:2 }}>
                {cw.colors.map((col,i) => <Swatch key={i} color={col} size={16}/>)}
              </div>
              <span style={{ fontSize:12, color: selColorway===cw.id ? '#fff' : C.light, flex:1 }}>{cw.name}</span>
              {selColorway===cw.id && <span style={{ fontSize:10, color:C.blue }}>✓</span>}
            </div>
          ))}
          <button style={{ width:'100%', fontFamily:'inherit', fontWeight:700, fontSize:11, padding:'8px', borderRadius:4, border:`1px solid ${C.border}`, background:'transparent', color:'#bbb', cursor:'pointer', marginTop:8 }}>
            + New Colorway
          </button>
          <button style={{ width:'100%', fontFamily:'inherit', fontWeight:700, fontSize:12, padding:'9px', borderRadius:4, border:'none', background:C.blue, color:'#fff', cursor:'pointer', marginTop:8 }}>
            Apply Colorway
          </button>
        </>}

        {view==='export' && <>
          <div style={{ fontSize:10, fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', color:C.muted, marginBottom:10 }}>Export Options</div>
          {[['Format','TIFF'],['Color space','CMYK'],['Resolution','200 dpi'],['Repeat','3 × 3']].map(([k,v]) => (
            <div key={k} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom:`1px solid ${C.border}` }}>
              <span style={{ fontSize:11, color:C.muted }}>{k}</span>
              <span style={{ fontSize:11, color:'#ddd', fontWeight:600 }}>{v}</span>
            </div>
          ))}
          <button style={{ width:'100%', fontFamily:'inherit', fontWeight:700, fontSize:12, padding:'9px', borderRadius:4, border:'none', background:C.blue, color:'#fff', cursor:'pointer', marginTop:14 }}>
            Export to neoStampa
          </button>
          <button style={{ width:'100%', fontFamily:'inherit', fontWeight:600, fontSize:11, padding:'8px', borderRadius:4, border:`1px solid ${C.border}`, background:'transparent', color:'#bbb', cursor:'pointer', marginTop:8 }}>
            Save as TIFF
          </button>
        </>}
      </div>
    </div>
  );
}

/* ─ Canvas area (simulates PS canvas) ─ */
function CanvasArea() {
  const [zoom, setZoom] = useState(100);
  const sel = colorways[0];
  return (
    <div style={{ flex:1, background:'#3a3a3a', display:'flex', flexDirection:'column', position:'relative' }}>
      {/* PS toolbar simulation */}
      <div style={{ height:36, background:'#2a2a2a', borderBottom:'1px solid #222', display:'flex', alignItems:'center', padding:'0 12px', gap:16, flexShrink:0 }}>
        <span style={{ fontSize:10, color:'#666' }}>Adobe Photoshop — Floral_S2024_v3.psd</span>
        <div style={{ marginLeft:'auto', display:'flex', gap:10, alignItems:'center' }}>
          <button onClick={() => setZoom(Math.max(25,zoom-25))} style={{ background:'none',border:'none',color:'#888',cursor:'pointer',fontFamily:'inherit',fontSize:12 }}>−</button>
          <span style={{ fontSize:10, color:'#888', minWidth:36, textAlign:'center' }}>{zoom}%</span>
          <button onClick={() => setZoom(Math.min(400,zoom+25))} style={{ background:'none',border:'none',color:'#888',cursor:'pointer',fontFamily:'inherit',fontSize:12 }}>+</button>
        </div>
      </div>
      {/* Pattern preview */}
      <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', position:'relative', overflow:'hidden' }}>
        <div style={{ position:'relative', boxShadow:'0 8px 40px rgba(0,0,0,0.5)', transform:`scale(${zoom/100})`, transition:'transform 250ms', transformOrigin:'center' }}>
          {/* Simulated repeating textile pattern */}
          <div style={{ width:480, height:360, display:'grid', gridTemplateColumns:'repeat(3,160px)', gridTemplateRows:'repeat(3,120px)', overflow:'hidden' }}>
            {Array.from({length:9}).map((_,i) => (
              <div key={i} style={{ position:'relative', overflow:'hidden',
                background: `linear-gradient(${i%2===0?'135deg':'225deg'}, ${sel.colors[0]} 0%, ${sel.colors[1]} 40%, ${sel.colors[2]} 70%, ${sel.colors[3]} 100%)` }}>
                {/* decorative shapes */}
                <div style={{ position:'absolute', borderRadius:'50%', width:60, height:80, top:i%3*10-10, left:i%2*20+20, background:sel.colors[4], opacity:0.5 }}/>
                <div style={{ position:'absolute', borderRadius:'50%', width:30, height:40, bottom:5, right:10, background:sel.colors[1], opacity:0.4 }}/>
              </div>
            ))}
          </div>
        </div>
        {/* Rapport grid overlay hint */}
        <div style={{ position:'absolute', top:12, right:12, background:'rgba(0,0,0,0.6)', borderRadius:4, padding:'4px 10px', fontSize:10, color:'#bbb' }}>
          30 × 30 cm · Half Drop
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{ display:'flex', height:'100vh', overflow:'hidden', flexDirection:'column' }}>
      <div style={{ flex:1, display:'flex', overflow:'hidden' }}>
        <CanvasArea/>
        <div style={{ width:260, display:'flex', flexDirection:'column', background:C.sidebar, borderLeft:'1px solid #222', padding:0 }}>
          <PluginPanel/>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

function parseVentasCSV(text){
  text = String(text||"").replace(/^﻿/, "");
  const lines = text.split(/\r\n|\n|\r/).filter(l => l.length);
  if (!lines.length) return {error:"archivo vacío"};
  const delim = (lines[0].split(";").length >= lines[0].split(",").length) ? ";" : ",";
  const headers = csvSplitLine(lines[0], delim).map(h => h.trim());
  const nh = headers.map(norm);
  // the first needle that matches any column wins, so specific names ("account name") beat generic ones ("account")
  const findCol = (...needles) => { for (const n of needles){ const i = nh.findIndex(x => x.includes(n)); if (i >= 0) return i; } return -1; };
  const cols = {
    amount: findCol("amount","importe","monto"), close_date: findCol("close date","fecha de cierre","fecha cierre"), stage: findCol("stage","fase","etapa"),
    name: findCol("opportunity name","nombre de la oportunidad","nombre"), owner: findCol("opportunity owner","propietario de la oportunidad","owner","propietario"),
    account: (() => { const i = findCol("account name","nombre de la cuenta"); return i >= 0 ? i : nh.findIndex(x => /account|cuenta/.test(x) && !/record type|tipo de registro|owner|propietario|\bid\b/.test(x)); })(),
    recordType: findCol("account record type","tipo de registro de la cuenta","tipo de registro de cuenta","record type","tipo de registro"),
    modified: findCol("last modified date","fecha de la ultima modificacion","fecha de ultima modificacion","ultima modificacion","last modified"),
    country: findCol("country","pais"), id: findCol("opportunity id","id de la oportunidad","id"),
    created: findCol("created date","fecha de creacion","fecha creacion","created on","creado el")
  };
  if (cols.amount < 0 || cols.close_date < 0 || cols.stage < 0) return {error:"faltan columnas de importe, fecha de cierre o fase", headers};
  const deals = []; let skippedBadRow = 0; const byGroup = {};
  for (const line of lines.slice(1)){
    const row = csvSplitLine(line, delim);
    if (!row.some(v => v && v.trim())) continue;
    const get = i => i >= 0 ? (row[i] || "").trim() : "";
    const d = parseDateJs(get(cols.close_date)), amount = parseAmountJs(get(cols.amount));
    if (!d){ skippedBadRow++; continue; }
    const stage = get(cols.stage) || null, name = get(cols.name) || null, account = get(cols.account) || null, owner = get(cols.owner) || null, country = get(cols.country) || null, sfId = get(cols.id) || null;
    const sg = stageGroupJs(stage);
    byGroup[sg] = (byGroup[sg]||0) + 1;
    deals.push({doc_id: "sf-" + sanitizeSalesId(sfId || `${account}-${name}-${d}-${amount}`),
      data: {opportunity:name, account, owner, country, date:d, quarter:quarterOfJs(d), ...(sfId ? {sfId} : {}), amount:Math.round((amount || 0)*100)/100, stage, stageGroup:sg, importedAt: Date.now(), ...(cols.created >= 0 ? {created: parseDateJs(get(cols.created)) || null} : {}), ...(cols.recordType >= 0 ? {recordType: get(cols.recordType) || null} : {}), ...(cols.modified >= 0 ? {modified: parseDateJs(get(cols.modified)) || null} : {})}});
  }
  return {deal_records: deals, by_stage_group: byGroup, skipped_bad_row: skippedBadRow, total_rows: lines.length - 1};
}
/* Write many documents without tripping the store's rate limits: a few at a time, retrying busy/transient errors, never stopping at the first failure */
async function writeDocs(col, items, onProgress){
  let next = 0, ok = 0, failed = 0, fatal = null;
  const worker = async () => {
    while (next < items.length && !fatal){
      const it = items[next++];
      for (let attempt = 0; ; attempt++){
        try { await S.db.collection(col).doc(it.id).set(it.data); ok++; break; }
        catch(e){
          const code = e && e.code;
          if (code === "quota_exceeded" || code === "revoked"){ fatal = e; break; }
          if (code !== "invalid_argument" && attempt < 6){ await new Promise(r => setTimeout(r, 500 * 2 ** attempt + Math.random() * 400)); continue; }
          failed++; break;
        }
      }
      if (onProgress) onProgress(ok + failed, items.length);
    }
  };
  await Promise.all(Array.from({length: Math.min(5, items.length)}, worker));
  return {ok, failed, fatal};
}
/* Same shape as writeDocs but for deletes: a few at a time, retrying busy errors */
async function deleteDocs(col, ids, onProgress){
  let next = 0, ok = 0, failed = 0, fatal = null;
  const worker = async () => {
    while (next < ids.length && !fatal){
      const id = ids[next++];
      for (let attempt = 0; ; attempt++){
        try { await S.db.collection(col).doc(id).delete(); ok++; break; }
        catch(e){
          const code = e && e.code;
          if (code === "quota_exceeded" || code === "revoked"){ fatal = e; break; }
          if (code !== "invalid_argument" && attempt < 6){ await new Promise(r => setTimeout(r, 500 * 2 ** attempt + Math.random() * 400)); continue; }
          failed++; break;
        }
      }
      if (onProgress) onProgress(ok + failed, ids.length);
    }
  };
  await Promise.all(Array.from({length: Math.min(5, ids.length)}, worker));
  return {ok, failed, fatal};
}
/* Incremental sync: each opportunity is matched with what is already saved and only new or changed rows are written.
   Match key: the Salesforce Opportunity ID when the export has it; otherwise account + opportunity name + created date,
   which do not change when the amount, stage, owner or close date are updated. */
const SALES_FIELDS = ["opportunity","account","owner","country","date","quarter","amount","stage","stageGroup","recordType","created","modified","sfId"];
const oppIdKey = d => d.sfId ? "id:" + String(d.sfId).trim() : null;
const oppKey = d => [norm(d.account || ""), norm(d.opportunity || ""), d.created || ("c:" + (d.date || ""))].join("|");
const sameVal = (a, b) => (a == null || a === "" ? null : typeof a === "number" ? Math.round(a * 100) : String(a).trim()) === (b == null || b === "" ? null : typeof b === "number" ? Math.round(b * 100) : String(b).trim());
const salesChanged = (a, b) => SALES_FIELDS.some(f => !sameVal(a[f], b[f]));
function planSalesSync(existing, incoming){
  const byId = new Map(), byKey = new Map(), used = new Set();
  const sortFn = (x, y) => String(x.date || "").localeCompare(String(y.date || "")) || (x.amount || 0) - (y.amount || 0);
  existing.slice().sort(sortFn).forEach(d => { const ik = oppIdKey(d); if (ik) byId.set(ik, d); const k = oppKey(d); if (!byKey.has(k)) byKey.set(k, []); byKey.get(k).push(d); });
  const take = d => { const ik = oppIdKey(d); if (ik && byId.has(ik) && !used.has(byId.get(ik).id)) return byId.get(ik);
    const list = byKey.get(oppKey(d)) || []; return list.find(x => !used.has(x.id)) || null; };
  const ids = new Set(existing.map(d => d.id)), added = [], changed = [], same = [];
  incoming.slice().sort((x, y) => sortFn(x.data, y.data)).forEach(r => {
    const m = take(r.data);
    if (m){ used.add(m.id); if (salesChanged(m, r.data)) changed.push({id:m.id, data:r.data}); else same.push(m.id); return; }
    let id = "sf-" + (r.data.sfId ? sanitizeSalesId(r.data.sfId) : hashStr(oppKey(r.data))), n = 1;
    while (ids.has(id)) id = id.replace(/~\d+$/, "") + "~" + (++n);
    ids.add(id); added.push({id, data:r.data});
  });
  const gone = existing.filter(d => !used.has(d.id));
  return {added, changed, same, gone};
}
async function handleSalesCsv(e){
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !S.db) return;
  S.salesImportBusy = true; render();
  try {
    // Salesforce can export as UTF-8 or ISO-8859-1: try UTF-8 first and fall back so accents survive either way
    const buf = await file.arrayBuffer();
    let text; try { text = new TextDecoder("utf-8", {fatal:true}).decode(buf); } catch(err){ text = new TextDecoder("windows-1252").decode(buf); }
    const res = parseVentasCSV(text);
    if (res.error){ toast(`No se han reconocido las columnas del CSV (${res.error}).`); return; }
    if (!res.deal_records.length){ toast("El archivo no tiene filas válidas (falta la fecha de cierre)."); return; }
    const batchAt = Date.now();
    res.deal_records.forEach(d => { d.data.importedAt = batchAt; });
    const plan = planSalesSync(S.sales, res.deal_records);
    const btn = () => document.getElementById("salesImportBtn");
    const writes = plan.added.concat(plan.changed);
    let w = {ok:0, failed:0, fatal:null};
    if (writes.length){
      w = await writeDocs("sales", writes, (n, t) => { const b = btn(); if (b && (n % 10 === 0 || n === t)) b.textContent = `Actualizando ${n} de ${t}…`; });
      if (w.fatal){ toast(`Importación detenida: se han guardado ${w.ok} de ${writes.length} cambios (${w.fatal.code === "quota_exceeded" ? "la base de datos está llena" : "se ha perdido el acceso"}). Vuelve a importar el mismo archivo para completar: solo se escribirá lo que falte.`); return; }
    }
    // Saved opportunities that are no longer in the file: only removed with your confirmation (a filtered export would otherwise wipe them)
    let del = {ok:0, failed:0}, kept = 0;
    if (plan.gone.length){
      const share = S.sales.length ? plan.gone.length / S.sales.length : 0;
      const msg = `${plan.gone.length.toLocaleString("es-ES")} oportunidades que tienes guardadas ya no aparecen en este archivo.` +
        (share > 0.25 ? ` Son el ${Math.round(share * 100)} % de lo guardado: si has exportado solo una parte del informe (otro filtro de fechas o de propietario), consérvalas.` : " Si el archivo es la exportación completa («All Time»), lo normal es que se hayan eliminado o fusionado en Salesforce.") +
        " ¿Eliminarlas también aquí?";
      if (await askConfirm(msg, "Eliminar")) del = await deleteDocs("sales", plan.gone.map(d => d.id), (n, t) => { const b = btn(); if (b && (n % 10 === 0 || n === t)) b.textContent = `Eliminando ${n} de ${t}…`; });
      else kept = plan.gone.length;
    }
    const g = res.by_stage_group;
    const parts = [`${plan.added.length} nuevas`, `${plan.changed.length} actualizadas`, `${plan.same.length} sin cambios`];
    if (del.ok) parts.push(`${del.ok} eliminadas`); if (kept) parts.push(`${kept} conservadas aunque no están en el archivo`);
    toast(!writes.length && !del.ok ? `Todo al día: las ${res.deal_records.length} oportunidades del archivo ya estaban guardadas y no ha cambiado ninguna.`
      : `Ventas actualizadas: ${parts.join(" · ")}${w.failed || del.failed ? ` (${w.failed + (del.failed || 0)} no se pudieron guardar; vuelve a importar el archivo)` : ""}. En el archivo: ${g.ganada||0} ganadas · ${g.abierta||0} en curso · ${g.perdida||0} perdidas.`);
  } catch(err){ toast(`No se ha podido leer o importar el archivo${err && err.code ? " (" + err.code + ")" : ""}.`); }
  finally { S.salesImportBusy = false; render(); }
}
/* Una oportunidad = misma cuenta + nombre + fecha de cierre + importe. Si aparece en varias importaciones, se queda solo la de la importación más reciente (filas idénticas dentro de una misma importación se respetan). */
const salesKey = d => [norm(d.account||""), norm(d.opportunity||""), d.date||"", Math.round((d.amount||0)*100)].join("|");
function dedupSales(rows){
  const groups = new Map();
  rows.forEach(d => { const k = salesKey(d); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); });
  const out = [];
  groups.forEach(g => {
    if (g.length === 1){ out.push(g[0]); return; }
    const newest = Math.max(...g.map(d => d.importedAt || 0));
    out.push(...g.filter(d => newest - (d.importedAt || 0) < 60000));
  });
  return out.sort((a,b) => String(a.date).localeCompare(String(b.date)));
}
/* ---------- Sales Analyst (uses the current sales filters) ---------- */
function salesSummary(f){
  const grp = (key, fn) => {
    const m = {};
    f.forEach(d => { const k = (fn ? fn(d) : d[key]) || "—"; const x = m[k] = m[k] || {n:0, amt:0, won:0, wonAmt:0, open:0, openAmt:0, lost:0};
      x.n++; x.amt += d.amount || 0;
      if (d.stageGroup === "ganada"){ x.won++; x.wonAmt += d.amount || 0; } else if (d.stageGroup === "perdida") x.lost++; else { x.open++; x.openAmt += d.amount || 0; } });
    return Object.entries(m).sort((a,b) => b[1].amt - a[1].amt).slice(0, 15).map(([k,x]) => `${k}: ${x.n} oport., ${Math.round(x.amt)} € en total; ganadas ${x.won} (${Math.round(x.wonAmt)} €); abiertas ${x.open} (${Math.round(x.openAmt)} €); perdidas ${x.lost}${x.won + x.lost ? `; tasa de éxito ${Math.round(x.won / (x.won + x.lost) * 100)} %` : ""}`).join("\n") || "sin datos";
  };
  const filters = [S.salesStage && "fase " + S.salesStage, S.salesType && "tipo de cuenta " + (S.salesType === "—" ? "sin tipo" : S.salesType), S.salesOwner && "propietario " + S.salesOwner, S.salesCountry && "país " + S.salesCountry, S.salesQuarter && "trimestre " + S.salesQuarter].filter(Boolean).join(", ") || "ninguno (todas las oportunidades)";
  const top = f.filter(d => d.stageGroup !== "perdida").sort((a,b) => (b.amount||0) - (a.amount||0)).slice(0, 15)
    .map(d => `${d.date} · ${d.account || "—"} · ${d.owner || "—"} · ${d.country || "—"} · ${d.stage || "—"} · ${Math.round(d.amount || 0)} €${d.recordType ? " · " + d.recordType : ""}${d.created ? " · creada " + d.created : ""}${d.modified ? " · últ. modif. " + d.modified : ""}`).join("\n");
  const total = f.reduce((s,d) => s + (d.amount || 0), 0);
  return `VENTAS (Salesforce). Hoy es ${todayStr()}. Filtros aplicados: ${filters}. Oportunidades: ${f.length}, importe total ${Math.round(total)} €.
OBJETIVOS GUARDADOS: ${JSON.stringify(S.salesTargets || {}).slice(0, 1500)}
POR AÑO:
${grp(null, d => String(yearOf(d) || ""))}
POR TRIMESTRE:
${grp("quarter")}
POR PROPIETARIO:
${grp("owner")}
POR TIPO DE CUENTA (Account Record Type):
${S.sales.some(d => d.recordType) ? grp("recordType") : "no hay datos: el CSV importado no trae esa columna"}
POR ZONA DE OBJETIVO:
${grp(null, d => countryGroupOf(d.country))}
POR FASE:
${grp("stage")}
MAYORES OPORTUNIDADES (no perdidas):
${top}`;
}

${salesSummary(f)}`, {cache:false, modelTier:"complex"});

}

/* ========================================================================
   Análisis comercial (dinámico): igual que el informe en PDF que se solía
   preparar a mano, pero calculado en vivo a partir de S.sales y
   S.salesTargets. No usa IA: son solo cifras, así que se recalcula solo
   cada vez que se importa un CSV nuevo o se cambia un objetivo, sin
   necesidad de pedir nada ni esperar.
   ======================================================================== */
function fracOfYear(yr){
  const y = +yr, now = new Date(), cy = now.getFullYear();
  if (y < cy) return 1;
  if (y > cy) return 0;
  return (now - new Date(cy,0,1)) / (new Date(cy+1,0,1) - new Date(cy,0,1));
}
function daysLeftInYear(yr){
  const y = +yr, now = new Date(), cy = now.getFullYear();
  if (y !== cy) return 0;
  return Math.max(0, Math.round((new Date(cy+1,0,1) - now) / 864e5));
}
const currentQuarterStr = () => quarterOfJs(todayStr());
function computeCommercialAnalysis(yr){
  yr = String(yr);
  const all = S.sales.filter(d => yearOf(d) === yr);
  const won = all.filter(d => d.stageGroup === "ganada");
  const open = all.filter(d => d.stageGroup === "abierta");
  const lost = all.filter(d => d.stageGroup === "perdida");
  const sum = arr => arr.reduce((s,d) => s + (d.amount||0), 0);
  const totalWon = sum(won), totalOpen = sum(open);
  const maxReachable = totalWon + totalOpen;
  const t = S.salesTargets || {};
  const companyTarget = +((t.targets && t.targets[yr]) || 0);
  const frac = fracOfYear(yr), pace = frac*100;
  const today = todayStr();

  // --- Evolución trimestral ---
  const quarters = ["Q1","Q2","Q3","Q4"].map(q => `${yr}-${q}`);
  const curQ = currentQuarterStr();
  const isCurYear = yr === String(new Date().getFullYear());
  const curQIdx = isCurYear ? quarters.indexOf(curQ) : -1;
  const highlightIdx = curQIdx > 0 ? curQIdx - 1 : -1;
  const qData = quarters.map((q,i) => ({ q, label:q.split("-")[1], amount: sum(won.filter(d=>d.quarter===q)), partial: i === curQIdx, highlighted: i === highlightIdx }));
  let qTrend = null;
  if (highlightIdx > 0){
    const curV = qData[highlightIdx].amount, prevV = qData[highlightIdx-1].amount;
    if (prevV) qTrend = {from:qData[highlightIdx-1].q, to:qData[highlightIdx].q, pct:(curV/prevV-1)*100};
  }

  // --- Por comercial ---
  const repRows = SALES_REPS.map(r => {
    const wonR = won.filter(d => ownerMatch(d, r.id)), openR = open.filter(d => ownerMatch(d, r.id)), lostR = lost.filter(d => ownerMatch(d, r.id));
    const wonAmt = sum(wonR), openAmt = sum(openR);
    const target = +((t.byOwner && t.byOwner[yr] && t.byOwner[yr][r.id]) || 0);
    const pct = target ? wonAmt/target*100 : null;
    const maxAmt = wonAmt + openAmt, maxPct = target ? maxAmt/target*100 : null;
    const gap = target - wonAmt;
    const successRate = (wonR.length+lostR.length) ? wonR.length/(wonR.length+lostR.length)*100 : null;
    const conversionNeeded = (target && gap > 0) ? (openAmt ? Math.min(999, gap/openAmt*100) : null) : null;
    const topWon = wonR.slice().sort((a,b)=>(b.amount||0)-(a.amount||0));
    const topShareN = Math.min(9, wonR.length);
    const concentrationPct = wonAmt ? sum(topWon.slice(0, topShareN))/wonAmt*100 : 0;
    return {rep:r, wonAmt, openAmt, openCount:openR.length, lostCount:lostR.length, wonCount:wonR.length, target, pct, maxAmt, maxPct, gap, successRate, conversionNeeded, topWon, topShareN, concentrationPct, openR};
  });
  const withTarget = repRows.filter(r => r.target).sort((a,b)=>a.pct-b.pct);
  const worstId = withTarget.length ? withTarget[0].rep.id : null;
  repRows.forEach(r => {
    if (!r.target){ r.status = {label:"Sin objetivo", tone:"#E7E7E7"}; return; }
    if (r.pct >= 100) r.status = {label:"Objetivo superado", tone:"#CFF0D6"};
    else if (r.pct >= pace) r.status = {label:"Por delante del ritmo", tone:"#CFF0D6"};
    else if (r.rep.id === worstId && r.maxPct < 100) r.status = {label:"Mayor riesgo del año", tone:"#FBC7D7"};
    else if (r.maxPct >= 100) r.status = {label:"Algo por detrás, alcanzable", tone:"#FFE9B8"};
    else r.status = {label:"Objetivo en riesgo", tone:"#FBC7D7"};
  });

  // --- Por tipo de cuenta ---
  const typeRows = [...new Set(all.map(d=>d.recordType||"—"))].map(k => {
    const arr = all.filter(d => (d.recordType||"—")===k);
    const wArr = arr.filter(d=>d.stageGroup==="ganada"), lArr = arr.filter(d=>d.stageGroup==="perdida"), oArr = arr.filter(d=>d.stageGroup==="abierta");
    const wAmt = sum(wArr), oAmt = sum(oArr);
    return {name:k, wonAmt:wAmt, pctTotal: totalWon ? wAmt/totalWon*100 : 0, avgTicket: wArr.length ? wAmt/wArr.length : null, successRate: (wArr.length+lArr.length) ? wArr.length/(wArr.length+lArr.length)*100 : null, openAmt:oAmt};
  }).sort((a,b)=>b.wonAmt-a.wonAmt);

  // --- Por zona (países agrupados) ---
  const byCountryTargets = (t.byCountry && t.byCountry[yr]) || {};
  const zoneRows = COUNTRY_GROUPS.map(g => {
    const arr = all.filter(d => countryGroupOf(d.country) === g.name);
    const wAmt = sum(arr.filter(d=>d.stageGroup==="ganada")), oAmt = sum(arr.filter(d=>d.stageGroup==="abierta"));
    const target = +byCountryTargets[g.name] || 0;
    return {name:g.name, wonAmt:wAmt, openAmt:oAmt, target, pct: target ? wAmt/target*100 : null, maxPct: target ? (wAmt+oAmt)/target*100 : null, gap: target - wAmt};
  }).filter(z => z.target || z.wonAmt || z.openAmt).sort((a,b) => (b.pct ?? -1) - (a.pct ?? -1));
  const zonesNoData = COUNTRY_GROUPS.filter(g => (+byCountryTargets[g.name]||0) > 0 && !all.some(d=>countryGroupOf(d.country)===g.name));
  const zonesShort = zoneRows.filter(z => z.target && z.maxPct < 100);

  // --- Pipeline por fase ---

  open.filter(d => (d.amount||0) >= avgOpenTicket*2)

    .sort((a,b)=>(b.amount||0)-(a.amount||0)).slice(0,2)

  const topStages = stageRows.slice(0,2);

  const zonesNoPipe = zoneRows.filter(z => z.gap > 0 && !z.openAmt).slice(0,3);
  if (zonesWithPipe.length || zonesNoPipe.length) plan.push({title:"Atacar zonas con hueco pero con pipeline", text:[
    zonesWithPipe.length ? `${zonesWithPipe.map(z=>`${z.name} (${fmtMoney(z.openAmt)} abiertos)`).join(", ")}: priorizar propuestas y fijar fecha de decisión.` : "",
    zonesNoPipe.length ? `En ${zonesNoPipe.map(z=>z.name).join(", ")} hay que generar oportunidades nuevas.` : ""
  ].filter(Boolean).join(" ")});
  const topWonAll = won.slice().sort((a,b)=>(b.amount||0)-(a.amount||0)).slice(0,2);
  plan.push({title:"Marketing en apoyo de ventas", text:`Casos de éxito con los cierres más grandes${topWonAll.length ? " (" + topWonAll.map(d=>`${d.account} · ${fmtMoney(d.amount)}`).join(", ") + ")" : ""}; nurturing de las ${stageRows.reduce((a,s)=>a+ (/propuesta/i.test(s.name)?s.count:0),0) || 0} propuestas en curso${zonesNoData.length ? `; activación de leads en zonas sin datos: ${zonesNoData.map(z=>z.name).join(", ")}` : ""}.`});

  return {yr, totalWon, totalOpen, maxReachable, companyTarget, pace, frac, qData, qTrend, repRows, typeRows, zoneRows, zonesNoData, zonesShort, stageRows, overdue, overdueAmt, overdueByQ, risks, plan, openCount: open.length};

// Same design, new frame: the original is fitted whole; the rest is filled with its own edge colour (seamless) or a blurred copy
async function reframeImage(img, f){
  const W = f.w, H = f.h, iw = img.naturalWidth, ih = img.naturalHeight;
  const sc = document.createElement("canvas"); sc.width = 64; sc.height = Math.max(1, Math.round(64 * ih / iw));

  const px = sx.getImageData(0, 0, sc.width, sc.height).data, edge = [];
  for (let x = 0; x < sc.width; x++) for (const y of [0, sc.height - 1]) edge.push(4 * (y * sc.width + x));
  for (let y = 0; y < sc.height; y++) for (const x of [0, sc.width - 1]) edge.push(4 * (y * sc.width + x));
  const avg = [0, 1, 2].map(k => edge.reduce((s, i) => s + px[i + k], 0) / edge.length);
  const dev = Math.sqrt(edge.reduce((s, i) => s + [0, 1, 2].reduce((a, k) => a + (px[i + k] - avg[k]) ** 2, 0), 0) / edge.length / 3);

    x.filter = "blur(48px) saturate(1.15)"; x.drawImage(img, (W - iw * cov) / 2 - 60, (H - ih * cov) / 2 - 60, iw * cov + 120, ih * cov + 120); x.filter = "none";

  x.drawImage(img, dx, dy, dw, dh);
  return await new Promise(res => c.toBlob(res, "image/png"));
}

async function ctGenerate(){
  const c = S.ct; if (!S.sample || c.busy) return;
  c.fields = c.fields.filter(f => f.name.trim() && f.limit > 0);
  if (!c.fields.length) { toast("Añade al menos un campo"); return; }
  c.busy = true; render();
  try {
    const data = await S.sample.json(ctPrompt(c), {cache:false, modelTier:"default"});
    if (!data || !Array.isArray(data.fields)) throw {code:"bad_shape"};
    c.out = c.fields.map((f, i) => ({name:f.name, limit:f.limit, en:(data.fields[i] && data.fields[i].en) || "", es:(data.fields[i] && data.fields[i].es) || ""}));

    const over = c.out.filter(f => ["en","es"].some(l => nchars(f[l]) > f.limit)).length;

  } catch(e){ toast(e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : "No se han podido generar los textos. Vuelve a intentarlo."); }

async function ctShorten(i, lang){
  const c = S.ct, f = c.out[i]; if (!S.sample || c.busy) return;
  c.busy = true; render();
  try {
    let text = f[lang];
    for (let attempt = 0; attempt < 2 && nchars(text) > f.limit; attempt++){
      const target = Math.floor(f.limit * (attempt ? 0.8 : 0.9));
      const res = await S.sample(`Acorta este texto a un máximo de ${target} caracteres contando espacios (ahora tiene ${nchars(text)}). Mantén el idioma, los datos concretos y el tono profesional; elimina lo menos importante y no añadas nada nuevo. Devuelve solo el texto acortado, sin comillas ni comentarios.\n\n${text}`, {cache:false, modelTier:"quick"});
      const out = String(res.text || "").trim().replace(/^["“]|["”]$/g, "");
      if (out) text = out;
    }
    if (nchars(text) > f.limit){
      // last resort: cut at the last full sentence that fits
      const chars = [...text].slice(0, f.limit).join("");
      const cut = Math.max(chars.lastIndexOf(". "), chars.lastIndexOf(".\n"));
      text = cut > f.limit * 0.5 ? chars.slice(0, cut + 1) : chars.trim();
    }
    f[lang] = text;
    toast(`Acortado a ${nchars(text)} caracteres`);
  } catch(e){
    toast(e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : e && e.code === "not_granted" ? "Sin permiso para usar Claude en esta página." : `No se ha podido acortar${e && e.code ? " (" + e.code + ")" : ""}`);
  } finally { c.busy = false; render(); }
}

function relSections(data, lang, product){

  const extra = (data._included || []).map(x => ({kind:"enhancement", module:x.module || "", items:[{en:x.as_enhancement_en, es:x.as_enhancement_es}]}));
  const sections = (data.sections || []).concat(extra);
  for (const kind of ["new","enhancement"]){
    const secs = sections.filter(sx => sx.kind === kind && (sx.items||[]).some(i => i[lang]));
    if (!secs.length) continue;
    // merge by module
    const byMod = new Map();
    secs.forEach(sx => { const k = sx.module || ""; if (!byMod.has(k)) byMod.set(k, []); byMod.get(k).push(...sx.items.filter(i=>i[lang])); });

    if (product === "neostampa"){

      for (const [mod, items] of byMod){

        out.push(`    <ul style="margin: 15px 0; padding-left: 20px;">\n` + items.map(i => `      <li style="margin-bottom: 12px;">${esc(i[lang])}</li>`).join("\n") + `\n    </ul>\n`);

        out.push(`    <ul style="padding-left: 20px;">\n` + items.map(i => `      <li style="margin-bottom: 12px;">\n        ${esc(i[lang])}\n      </li>`).join("\n") + `\n    </ul>\n`);

  }
  return out.join("\n");
}

    sec.append(h("div",{class:"tablewrap"}, h("table",{class:"table"}, h("thead",null, h("tr",null, h("th",null,"Producto"), h("th",null,"Versión"), h("th",null,"Fecha"), h("th",null,""))), tb)));
  }
  wrap.append(sec);
  return wrap;
}
function reqFor(product){
  const c = S.reqCfg && S.reqCfg[product];
  return c ? {en:Object.assign({}, REQ_DEFAULT[product].en, c.en), es:Object.assign({}, REQ_DEFAULT[product].es, c.es)} : REQ_DEFAULT[product];
}
function parseImages(t){ return String(t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l => { const [url, ...alt] = l.split("|"); return {url:url.trim(), alt:alt.join("|").trim()}; }).filter(i => /^https?:\/\//.test(i.url)); }
async function generateRelease(){
  const r = S.rel;
  if (!S.sample || r.busy) return;
  if (!r.version) { toast("Indica la versión"); return; }
  if (!r.raw.trim()) { toast("Pega las notas en bruto"); return; }
  r.images = parseImages(r.imagesText);
  r.busy = true; render();
  try {
    const data = await S.sample.json(REL_PROMPT(r), {cache:false, modelTier:"default"});
    if (!data || !Array.isArray(data.sections)) throw {code:"bad_shape"};
    data.excluded = Array.isArray(data.excluded) ? data.excluded : [];
    data._included = [];
    r.data = data; r.lang = "en";
    toast(data.excluded.length ? `Listo. ${data.excluded.length} corrección(es) apartada(s).` : "Listo");
  } catch(e){
    toast(e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : e && e.code === "not_granted" ? "Sin permiso para usar Claude en esta página." : "No se han podido generar las notas. Vuelve a intentarlo.");
  } finally { r.busy = false; render(); }
}
async function saveRelease(){
  const r = S.rel; if (!S.db || !r.data) return;
  const included = (r.data._included || []).map(x => r.data.excluded.indexOf(x)).filter(i => i >= 0);
  const data = Object.assign({}, r.data); delete data._included; data.includedIdx = included;
  const doc = {product:r.product, version:r.version, date:r.date, raw:r.raw, imagesText:r.imagesText, images:r.images, data, updatedAt:Date.now()};
  try {
    if (r.id) await S.db.collection("releases").doc(r.id).set(Object.assign({createdAt: r.createdAt || Date.now()}, doc));
    else { doc.createdAt = Date.now(); const ref = await S.db.collection("releases").add(doc); r.id = ref.id; r.createdAt = doc.createdAt; }
    toast("Versión guardada"); render();
  } catch(e){ toast("No se ha podido guardar la versión"); }
}
async function addDerived(r){
  const name = `${PRODUCTS[r.product].name} ${r.version}`;
  const base = r.date ? parseYmd(r.date) : new Date();
  const at = n => ymd(new Date(base.getFullYear(), base.getMonth(), base.getDate() + n));
  const summary = (r.data.sections||[]).flatMap(sx => (sx.items||[]).map(i => "- " + (i.en || i.es))).slice(0,12).join("\n");
  const pieces = [
    {channel:"website", date:at(0), title:`Publicar notas de versión ${name} (EN y ES)`},
    {channel:"linkedin", date:at(1), title:`Post de lanzamiento: ${name}`},
    {channel:"meta", date:at(2), title:`Post corto de lanzamiento: ${name}`},
    {channel:"youtube", date:at(7), title:`Vídeo demo de la novedad principal de ${name}`}
  ];
  if (!(await askConfirm(`Se añadirán ${pieces.length} piezas al calendario como "Idea" (web, LinkedIn, Meta y YouTube). ¿Continuar?`, "Añadir"))) return;
  try {
    for (const p of pieces) await S.db.collection("items").add(Object.assign(p, {status:"idea", product:r.product, lang:"en", body:`Basado en las notas de versión de ${name}:\n${summary}`, createdAt:Date.now(), updatedAt:Date.now()}));
    toast("Piezas añadidas al calendario");
  } catch(e){ toast("No se han podido añadir las piezas"); }
}
function releasesContext(){
  const rs = S.releases.slice(0,3);
  if (!rs.length) return "";
  return "\n\nÚLTIMAS NOTAS DE VERSIÓN GUARDADAS (fuente válida; no incluyen correcciones de errores):\n" + rs.map(x => `${PRODUCTS[x.product]?.name} ${x.version} (${x.date || "sin fecha"}):\n` + ((x.data && x.data.sections) || []).flatMap(sx => (sx.items||[]).map(i => "- " + (sx.module ? sx.module + ": " : "") + (i.en || i.es))).slice(0,10).join("\n")).join("\n");
}

document.getElementById("dlg").addEventListener("close", () => { document.getElementById("dlg").onpaste = null; });
new MutationObserver(muts => { if (S.uiLang !== "en" && !S._wasEn) return; for (const m of muts) m.addedNodes.forEach(n => trNode(n)); }).observe(document.body, {childList:true, subtree:true});
applyTheme(S.theme);
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ((S.theme || "auto") === "auto") renderRail(); }); } catch(e){}
try { if (localStorage.getItem("ics-rail-mini") === "1") document.body.classList.add("rail-mini"); } catch(e){}
document.getElementById("scrim").addEventListener("click", () => setNavOpen(false));

renderRail(); render(); setFoot();
(async () => {
  const use = window.claude && window.claude.use ? n => window.claude.use(n).catch(()=>null) : async () => null;
  const [db, sample, assets, user, downloads, mcp] = await Promise.all([use("db"), use("sample"), use("assets"), use("user"), use("downloads"), use("mcp")]);
  S.db = db; S.sample = sample; S.assets = assets; S.user = user; S.downloads = downloads; S.mcp = mcp; S.dbReady = true;
  loadDashRemote();
  setFoot();
  if (db){
    const sub = (path, field, key) => db.collection(path).orderBy(field, field === "date" ? "asc" : "desc").onSnapshot(
      snap => { const rows = snap.docs.map(d => Object.assign({id:d.id}, d.data())); S[key] = key === "sales" ? dedupSales(rows) : rows; S.ready[key] = true; rerenderIfNotCommand(); },
      () => { toast("Se ha perdido la conexión con el almacenamiento. Recarga la página."); });
    sub("items","date","items"); sub("tasks","createdAt","tasks"); sub("library","createdAt","library"); sub("ideas","createdAt","ideas"); sub("releases","createdAt","releases"); sub("companytexts","updatedAt","companyTexts"); sub("models","createdAt","models"); sub("metrics","date","metrics"); sub("reports","createdAt","reports"); sub("content","updatedAt","content"); sub("folders","createdAt","folders"); sub("designreq","createdAt","designReqs"); sub("sales","date","sales");
    db.collection("config").onSnapshot(snap => { const c = {}; snap.docs.forEach(d => { if (d.id.startsWith("req-")) c[d.id.slice(4)] = d.data(); if (d.id === "brandkit") S.brandCfg = d.data(); if (d.id === "backup") S.backupCfg = d.data(); if (d.id === "knowledge") S.knowledge = d.data(); if (d.id === "metrics") S.metricsCfg = d.data(); if (d.id === "sales-targets") S.salesTargets = d.data(); if (d.id === "i18n-en") { const m = d.data().map; if (m) { S.i18n = m; if (S.uiLang === "en" && S.sample && !S._autoTr && UI_STRINGS.some(k => !(k in m))) { S._autoTr = true; setTimeout(() => ensureEnglish().then(ok => { if (ok){ render(); trNode(document.body); } }), 800); } S._rev = null; } } }); S.reqCfg = c; setFoot(); if (S.uiLang === "en") trNode(document.body); if (S.view === "releases" || (S.view === "results" && S.resTab === "ventas" && !document.activeElement?.matches?.("input,select,textarea"))) render(); }, () => {});
  }
  render();
  if (db) loadDocs();
})();
})();

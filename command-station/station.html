<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inèdit Command Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F29B6C">
<style>
:root{
  --paper:#F3F4F5; --surface:#FFFFFF; --ink:#1C2024; --muted:#5E6367; --line:#DADDE0; --soft:#ECEEF0;
  --accent:#FE5000; --accent-ink:#FFFFFF; --gray:#888B8D;
  --c-linkedin:#3A6EA5; --c-meta:#8E5BD6; --c-newsletter:#C98A00; --c-emailing:#D45D8C; --c-ferias:#E8742A; --c-webinars:#2A9D8F; --c-website:#6E7376; --c-youtube:#B23A3A;
  --radius:6px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14171A; --surface:#1C2024; --ink:#ECEEF0; --muted:#A3A8AC; --line:#30363B; --soft:#252A2F;
    --accent:#FF6A26; --c-website:#9AA0A4; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171A; --surface:#1C2024; --ink:#ECEEF0; --muted:#A3A8AC; --line:#30363B; --soft:#252A2F;
  --accent:#FF6A26; --c-website:#9AA0A4; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink);
  font-family:Arial,"Helvetica Neue",Helvetica,sans-serif; font-size:15px; line-height:1.5}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a{color:inherit}

.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
.rail{background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:18px; position:sticky; top:0; height:100vh; overflow:auto}
.brand{display:flex; flex-direction:column; gap:10px; padding:0 6px}
.brand h1{margin:0; font-size:19px; font-weight:800;  letter-spacing:-.01em; line-height:1.1}
.brand small{color:var(--muted); font-size:12.5px}
.strip{display:grid; grid-template-columns:repeat(8,1fr); gap:3px}
.strip button{height:14px; border:0; border-radius:2px; padding:0}
.strip button[aria-current="true"]{outline:2px solid var(--ink); outline-offset:1px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav .group{font-size:12px; color:var(--muted); padding:12px 8px 4px}
.nav button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:transparent; padding:8px 8px; border-radius:var(--radius); font-size:14.5px}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--soft); font-weight:650}
.dot{width:10px; height:10px; border-radius:2px; flex:none}
.nav .count{margin-left:auto; font-size:12px; color:var(--muted)}
.rail .foot{margin-top:auto; font-size:12px; color:var(--muted); padding:0 8px}

main{padding:28px clamp(16px,3vw,40px) 60px; min-width:0}
.head{display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 20px; margin-bottom:22px}
.head h2{margin:0; font-size:clamp(24px,3vw,32px); font-weight:800;  letter-spacing:-.015em; line-height:1.05}
.head p{margin:4px 0 0; color:var(--muted); max-width:62ch}
.head .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}

.btn{border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:var(--radius); font-size:14px; font-weight:550}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px; font-size:13px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn.danger{color:#C42A1A}

.notice{background:var(--soft); border-left:3px solid var(--gray); padding:10px 14px; border-radius:var(--radius); font-size:14px; margin-bottom:18px}

/* Command */
.command{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start}
.composer{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px}
.selects{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px}
.selects label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
select,input[type=text],input[type=url],input[type=number],input[type=date],textarea{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; font-size:14px}
textarea{width:100%; resize:vertical; min-height:88px; line-height:1.5}
.composer .row{display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap}
.composer .hint{font-size:12.5px; color:var(--muted); margin-right:auto}
.thread{display:flex; flex-direction:column; gap:14px; margin-top:18px}
.msg{border-radius:10px; padding:14px 16px; max-width:100%}
.msg.user{background:var(--soft); align-self:flex-end; max-width:80%}
.msg.ai{background:var(--surface); border:1px solid var(--line)}
.msg .who{font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; gap:8px; align-items:center}
.msg .body{white-space:pre-wrap; word-wrap:break-word; font-size:14.5px; line-height:1.6}
.msg .tools{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.msg.thinking .body{color:var(--muted)}
.side h3{font-size:15px; font-weight:700;  margin:0 0 10px}
.side .panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px}
.upnext{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
.upnext li{display:grid; grid-template-columns:10px 1fr; gap:8px; align-items:start; font-size:13.5px}
.upnext li .dot{margin-top:6px}
.upnext .meta{color:var(--muted); font-size:12px}
.upnext button{all:unset; cursor:pointer}
.upnext button:hover .t{text-decoration:underline}
.empty{color:var(--muted); font-size:13.5px}
.quick{display:flex; flex-direction:column; gap:6px}
.quick button{text-align:left; border:1px dashed var(--line); background:transparent; border-radius:var(--radius); padding:8px 10px; font-size:13.5px}
.quick button:hover{border-color:var(--accent)}

/* Channel / calendar */
.cal-bar{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.cal-bar strong{font-size:17px;  min-width:150px}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-left:auto}
.legend span{display:inline-flex; align-items:center; gap:5px}
.status-dot{width:8px; height:8px; border-radius:50%; display:inline-block}
.calwrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.cal{display:grid; grid-template-columns:repeat(7,minmax(104px,1fr)); min-width:728px}
.cal .dow{font-size:12px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line)}
.cal .day{min-height:108px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px 6px 8px; display:flex; flex-direction:column; gap:4px; position:relative}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--paper)}
.cal .day.out .n{opacity:.45}
.cal .day .n{font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; align-items:center}
.cal .day.today .n b{background:var(--accent); color:var(--accent-ink); border-radius:4px; padding:0 5px}
.cal .day .add{opacity:0; border:0; background:transparent; font-size:16px; line-height:1; color:var(--muted); padding:0 4px}
.cal .day:hover .add,.cal .day .add:focus-visible{opacity:1}
.chip{display:block; width:100%; text-align:left; border:0; border-left:3px solid var(--chan,var(--gray)); background:var(--soft); border-radius:3px; padding:3px 6px; font-size:12.5px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip:hover{background:var(--line)}
.chip .status-dot{margin-right:5px; vertical-align:1px}
.list{margin-top:26px}
.list h3{font-size:16px;  margin:0 0 10px}
.table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.tablewrap{overflow-x:auto}
.table th,.table td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:top}
.table th{font-size:12px; color:var(--muted); font-weight:600}
.table tr:last-child td{border-bottom:0}
.table td button.link{all:unset; cursor:pointer; font-weight:600}
.table td button.link:hover{text-decoration:underline}

/* Portal */
.tabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:18px}
.tabs button{border:0; background:transparent; padding:9px 14px; font-size:14px; border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent); font-weight:650}
.drop{border:1.5px dashed var(--line); border-radius:10px; padding:20px; text-align:center; color:var(--muted); margin-bottom:18px; background:var(--surface)}
.drop.over{border-color:var(--accent); color:var(--ink)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
.asset{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column}
.asset .thumb{aspect-ratio:4/3; background:var(--soft); display:flex; align-items:center; justify-content:center; overflow:hidden}
.asset .thumb img{max-width:100%; max-height:100%; object-fit:contain}
.asset .thumb .ext{font-weight:800;  font-size:22px; color:var(--muted)}
.asset .info{padding:10px 12px; display:flex; flex-direction:column; gap:4px; flex:1}
.asset .name{font-size:13.5px; font-weight:600; word-break:break-word}
.asset .meta{font-size:12px; color:var(--muted)}
.asset .acts{display:flex; gap:6px; margin-top:auto; padding-top:8px}
.ideas{display:flex; flex-direction:column; gap:10px}
.idea{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--chan,var(--gray)); border-radius:6px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start}
.idea .txt{flex:1; white-space:pre-wrap; font-size:14px}
.idea .meta{font-size:12px; color:var(--muted); margin-top:4px}
.idea .acts{display:flex; gap:6px; flex-wrap:wrap}
.ideaform{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:flex-end}
.ideaform textarea{flex:1 1 320px; min-height:60px}

/* Dialog */
dialog{border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); padding:0; width:min(640px,calc(100vw - 24px)); max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(20,23,26,.45)}
.dlg{padding:20px 22px; display:flex; flex-direction:column; gap:12px}
.dlg h3{margin:0; font-size:18px; }
.dlg .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dlg label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.dlg textarea{min-height:180px}
.dlg .row{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.dlg .row .left{margin-right:auto}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:8px; font-size:14px; z-index:50; opacity:0; transition:opacity .2s}
.toast.show{opacity:1}



/* Composer v2 */
.step{margin-bottom:14px}
.step .lbl{font-size:12.5px; color:var(--muted); margin-bottom:6px; display:flex; gap:8px; align-items:baseline}
.step .lbl b{color:var(--ink); font-weight:650; font-size:13px}
.types{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.type{border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:10px 11px; text-align:left; display:flex; flex-direction:column; gap:2px; min-height:64px}
.type:hover{border-color:var(--muted)}
.type[aria-pressed="true"]{border-color:var(--accent); background:var(--surface); box-shadow:inset 0 0 0 1px var(--accent)}
.type .tn{font-weight:650; font-size:13.5px; line-height:1.25}
.type .td{font-size:12px; color:var(--muted); line-height:1.3}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.pchip{border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:5px 12px 5px 6px; font-size:13px; display:inline-flex; align-items:center; gap:7px}
.pchip.noicon{padding-left:12px}
.pchip[aria-pressed="true"]{border-color:var(--ink); background:var(--surface); font-weight:650}
.picon{width:20px; height:20px; border-radius:4px; color:#fff; font-size:10px; font-weight:800; display:inline-flex; align-items:center; justify-content:center; letter-spacing:-.02em; flex:none}
.agentbar{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; background:var(--soft); border-radius:8px; padding:9px 12px; font-size:13.5px; margin:4px 0 12px}
.agentbar .k{color:var(--muted); font-size:12px}
.badge{display:inline-flex; align-items:center; gap:6px; font-weight:650}
.sub{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:1px 6px; border-radius:4px; color:#fff; vertical-align:1px}
.prodf{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px}

/* Brand kit */
.kit section{margin-bottom:34px}
.kit h3{font-size:18px;  margin:0 0 4px}
.kit .intro{color:var(--muted); font-size:14px; margin:0 0 14px; max-width:70ch}
.swatches{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px}
.sw{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.sw .chipc{height:96px; display:flex; align-items:flex-end; padding:10px 12px; color:#fff; font-weight:750;  font-size:16px}
.sw .vals{padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:13px}
.sw .vals span:nth-child(odd){color:var(--muted)}
.sw .vals button{all:unset; cursor:pointer; font-variant-numeric:tabular-nums}
.sw .vals button:hover{text-decoration:underline}
.tints{display:flex; height:28px; border-top:1px solid var(--line)}
.tints div{flex:1; font-size:10.5px; display:flex; align-items:center; justify-content:center; color:#fff}
.grad{height:22px; border-top:1px solid var(--line)}
.dodont{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.dodont .box{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.dodont .box h4{margin:0 0 8px; font-size:14.5px}
.dodont ul{margin:0; padding-left:18px; font-size:14px}
.dodont li{margin-bottom:5px}
.names{display:flex; flex-wrap:wrap; gap:10px}
.names div{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px}
.names small{display:block; color:var(--muted); font-size:12px}
@media (max-width:1100px){ .types{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .dodont{grid-template-columns:1fr} }

/* Design brief */
.msg.design{border-color:var(--accent); border-style:dashed}
.msg.design .who{color:var(--ink)}
.dlg .design{display:flex; flex-direction:column; gap:6px}
.dlg .design textarea{min-height:120px; font-size:13px}
.cdtip{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:8px; padding:14px 16px; max-width:760px; font-size:14px}
.cdtip ol{margin:6px 0 10px; padding-left:20px}
/* Visual designs */
.visual{border:1px solid var(--line); border-radius:10px; background:var(--surface); overflow:hidden}
.visual .stage{background:repeating-conic-gradient(var(--soft) 0% 25%, var(--surface) 0% 50%) 50% / 20px 20px; padding:14px; display:flex; justify-content:center}
.visual .stage img{max-width:100%; max-height:520px; height:auto; box-shadow:0 2px 10px rgba(0,0,0,.12); background:#fff}
.visual .tweak{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); flex-wrap:wrap}
.visual .tweak input{flex:1 1 260px}
.canva{font-size:13px; padding:8px 12px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.canva a{font-weight:650}
.dlg .thumb{max-width:100%; max-height:220px; border:1px solid var(--line); border-radius:6px; background:#fff; align-self:flex-start}
/* Portal links */
.linkform{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:18px; display:grid; grid-template-columns:minmax(160px,1fr) minmax(240px,2fr) auto; gap:10px; align-items:end}
.linkform label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.linkform input{width:100%; min-width:0}
.linkform .extra{grid-column:1 / -1; display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.asset .src{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px}
.asset .src .od{display:inline-block; font-size:10.5px; font-weight:700; color:#fff; background:#0364B8; border-radius:3px; padding:0 5px}
.asset .warn{font-size:12px; color:#B26B00}
@media (max-width:760px){ .linkform{grid-template-columns:1fr} }
/* Company texts */
.ct{display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:24px; align-items:start}
.ct .form{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px}
.ct .form label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.ct .form input,.ct .form select{width:100%; min-width:0}
.ct .form input[type=checkbox]{width:auto; flex:none}
.fieldrow{display:grid; grid-template-columns:1fr 92px 30px; gap:6px; align-items:center}
.fieldrow button{border:0; background:transparent; font-size:18px; color:var(--muted)}
.presets{display:flex; flex-wrap:wrap; gap:6px}
.ctout{display:flex; flex-direction:column; gap:14px}
.fcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px}
.fcard .fh{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap}
.fcard .fh strong{font-size:14.5px}
.fcard textarea{min-height:150px; font-size:14px; background:var(--paper)}
.fcard .ff{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap}
.count{font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--muted); margin-left:auto}
.count.over{color:#C42A1A}
.count.ok{color:#2E7D32}
@media (max-width:1100px){ .ct{grid-template-columns:1fr} }
/* Chat */
.reply{position:sticky; bottom:calc(10px + env(safe-area-inset-bottom,0px)); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:14px; box-shadow:0 4px 18px rgba(0,0,0,.08)}
.reply.ask{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 4px 18px rgba(0,0,0,.08)}
.reply textarea{min-height:64px; background:var(--paper)}
.reply .row{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap}
.reply .hint{font-size:12.5px; color:var(--muted); margin-right:auto}
.msg.asks{border-color:var(--accent)}
.asklabel{display:inline-block; font-size:11.5px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em}
/* Models & pack */
.models{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.mcard{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--chan,var(--gray)); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.mcard .mt{font-weight:650; font-size:14px}
.mcard .mm{font-size:12px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.mcard .mb{font-size:13px; white-space:pre-wrap; max-height:140px; overflow:hidden; color:var(--ink); mask-image:linear-gradient(#000 70%, transparent)}
.mform{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:18px; display:flex; flex-direction:column; gap:10px}
.mform .g4{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
.mform label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.mform input,.mform select{width:100%; min-width:0}
.pack{display:grid; grid-template-columns:minmax(0,400px) minmax(0,1fr); gap:24px; align-items:start}
.pack .form{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px}
.pack .form label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.pack .form input,.pack .form select{width:100%; min-width:0}
.pack .form input[type=checkbox]{width:auto}
.pick{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto}
.pick button{text-align:left; border:1px solid var(--line); background:var(--paper); border-radius:6px; padding:7px 10px; font-size:13px}
.pick button[aria-pressed="true"]{border-color:var(--accent); background:var(--surface)}
.pieces label{flex-direction:row !important; align-items:center; gap:8px; color:var(--ink) !important; font-size:13.5px !important}
.core{background:var(--soft); border-radius:10px; padding:12px 14px; font-size:13.5px; margin-bottom:14px}
.core b{display:block; font-size:15px; margin-bottom:4px}
.pcard{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--chan,var(--gray)); border-radius:10px; padding:12px 14px; margin-bottom:12px}
.pcard .ph{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.pcard .ph strong{font-size:14.5px}
.pcard .ph input[type=date]{margin-left:auto}
.pcard textarea{min-height:170px; background:var(--paper); font-size:13.5px}
.pcard .pf{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center}
.pcard .rv{margin-top:8px; font-size:13px; white-space:pre-wrap; background:var(--soft); border-radius:6px; padding:8px 10px; max-height:220px; overflow:auto}
@media (max-width:1100px){ .pack{grid-template-columns:1fr} .mform .g4{grid-template-columns:1fr 1fr} }
/* Results, planner, fair */
.kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:18px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.kpi .v{font-size:24px; font-weight:800; }
.kpi .l{font-size:12.5px; color:var(--muted)}
.report{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:14px 16px; white-space:pre-wrap; font-size:14px; line-height:1.6; margin-bottom:18px}
.srcline{margin:-4px 0 16px; font-size:12.5px; color:var(--muted); white-space:pre-wrap}
.list:has(> .colhead[aria-expanded="false"]){margin:0 !important; padding:12px 0; border-top:1px solid var(--line)}
.list:has(> .colhead[aria-expanded="false"]) + .list:has(> .colhead[aria-expanded="false"]){border-top:1px solid var(--line)}
.list:has(> .colhead[aria-expanded="false"]) .colhead{margin:0}
.list:has(> .colhead[aria-expanded="true"]){margin-top:14px !important; padding-top:12px; border-top:1px solid var(--line)}
.srcs{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:18px}
.src{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px}
.src b{display:block; font-size:14px}
.src .on{color:#2E7D32; font-weight:700}
.src .off{color:var(--muted)}
.plan{background:var(--surface); border:1px solid var(--accent); border-radius:10px; padding:14px 16px; margin-bottom:18px}
.plan h3{margin:0 0 6px; font-size:16px}
.plan .pi{display:grid; grid-template-columns:24px 92px 1fr; gap:10px; padding:9px 0; border-top:1px solid var(--line); align-items:start; font-size:13.5px}
.plan .pi .why{color:var(--muted); font-size:12.5px}
.fair{display:grid; grid-template-columns:minmax(0,400px) minmax(0,1fr); gap:24px; align-items:start}
.fair .form{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px}
.fair .form label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.fair .form input,.fair .form select{width:100%; min-width:0}
.fair .form input[type=checkbox]{width:auto}
.fair .g2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:1100px){ .fair{grid-template-columns:1fr} }
/* Content library */
.lib{display:grid; grid-template-columns:230px minmax(0,1fr); gap:22px; align-items:start}
.folders{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:2px; position:sticky; top:16px}
.folders .f{display:flex; align-items:center; gap:8px; border:0; background:transparent; text-align:left; padding:7px 9px; border-radius:6px; font-size:14px; width:100%}
.folders .f:hover{background:var(--soft)}
.folders .f[aria-current="true"]{background:var(--soft); font-weight:650}
.folders .f .n{margin-left:auto; font-size:12px; color:var(--muted)}
.folders .sep{height:1px; background:var(--line); margin:6px 4px}
.folders .fa{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px 2px 2px}
.folders .fa .btn{width:100%; white-space:nowrap; padding:8px 6px; text-align:center; min-width:0; overflow:hidden; text-overflow:ellipsis}
.folders .fa .btn:first-child{grid-column:1 / -1}
.ftools{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.ftools input[type=search]{flex:1 1 240px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:14px}
.ftools select{background:var(--surface)}
.cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
.ccard{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; text-align:left; padding:0; cursor:pointer}
.ccard:hover{border-color:var(--muted)}
.ccard .cthumb{height:120px; background:var(--soft); display:flex; align-items:center; justify-content:center; overflow:hidden}
.ccard .cthumb img{max-width:100%; max-height:100%; object-fit:contain}
.ccard .cb{padding:11px 13px; display:flex; flex-direction:column; gap:5px}
.ccard .ct{font-weight:650; font-size:14px; line-height:1.3}
.ccard .cm{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:11.5px; color:var(--muted)}
.ccard .cx{font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-wrap}
.kind{display:inline-block; font-size:11px; font-weight:700; padding:1px 6px; border-radius:4px; background:var(--soft); color:var(--ink)}
@media (max-width:900px){ .lib{grid-template-columns:1fr} .folders{position:static} }
.libdrop{border:1.5px dashed var(--line); border-radius:10px; padding:14px; text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:14px; background:var(--surface)}
.libdrop.over{border-color:var(--accent); color:var(--ink)}
.ccard .cthumb .ext{font-weight:800;  font-size:22px; color:var(--muted)}
/* Previews */
.pv{border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--soft)}
.pv .pvimg{display:flex; justify-content:center; align-items:center; background:repeating-conic-gradient(var(--soft) 0% 25%, var(--surface) 0% 50%) 50% / 18px 18px; padding:10px}
.pv .pvimg img{max-width:100%; max-height:380px; height:auto; box-shadow:0 2px 10px rgba(0,0,0,.15); background:#fff}
.pv .pvbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 10px; border-top:1px solid var(--line); background:var(--surface); font-size:12.5px; color:var(--muted)}
.pv .pvdrop{padding:22px 16px; text-align:center; border:1.5px dashed var(--line); margin:10px; border-radius:8px; color:var(--muted); font-size:13.5px; background:var(--surface)}
.pv.over .pvdrop{border-color:var(--accent); color:var(--ink)}
.pv .pvsrc{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; margin-bottom:8px}
.pthumb{width:52px; height:40px; object-fit:cover; border-radius:4px; border:1px solid var(--line); background:#fff; display:block}
.pbadge{display:inline-block; font-size:10.5px; font-weight:700; color:#fff; border-radius:3px; padding:1px 5px}
.langsw{display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin-top:8px}
.langsw button{border:0; background:transparent; padding:5px 10px; white-space:nowrap; font-size:12.5px; font-weight:700; color:var(--muted); min-height:30px}
.langsw button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
/* Releases */
.rel{display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:24px; align-items:start}
.rel .form{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px}
.rel .form label{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.rel .form .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
.rel .form input,.rel .form select{width:100%; min-width:0}
.rel .form textarea.raw{min-height:220px; font-size:13.5px}
.rel details{border-top:1px solid var(--line); padding-top:10px}
.rel details summary{cursor:pointer; font-size:13.5px; font-weight:600}
.rel details .req{display:grid; grid-template-columns:1fr; gap:8px; margin-top:10px}
.rel details textarea{min-height:110px; font-size:12.5px}
.out{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; min-height:200px}
.out .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.out .bar .tabs{margin:0 auto 0 0; border:0}
.out iframe{width:100%; height:560px; border:1px solid var(--line); border-radius:6px; background:#f7f7f7}
.excl{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
.excl h4{margin:0 0 6px; font-size:14px}
.excl p.small{margin:0 0 8px; font-size:12.5px; color:var(--muted)}
.excl label{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line)}
.excl label s{color:var(--muted)}
.qs{margin-top:12px; font-size:13px; background:var(--soft); border-radius:6px; padding:10px 12px}
.qs ul{margin:4px 0 0; padding-left:18px}
@media (max-width:1100px){ .rel{grid-template-columns:1fr} .rel .form .grid3{grid-template-columns:1fr 1fr} }

@media (max-width:960px){ .command{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky; top:0; z-index:20; height:auto; flex-direction:column; padding:10px 12px; gap:8px; border-right:0; border-bottom:1px solid var(--line); padding-top:calc(10px + env(safe-area-inset-top,0px)); margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .brand{flex-direction:row; align-items:center; justify-content:space-between}
  .brand small,.rail .foot,.nav .group{display:none}
  .strip{width:120px}
  .nav{flex-direction:row; overflow-x:auto; gap:4px}
  .nav button{white-space:nowrap; width:auto; padding:6px 10px}
  .nav .count{display:none}
  .dlg .grid2{grid-template-columns:1fr}
  .msg.user{max-width:100%}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

/* ===== Minimal pastel theme ===== */
:root{
  --paper:#F4EDEB; --surface:#FFFCFB; --ink:#2E2B2D; --muted:#857E80; --line:#EEE4E1; --soft:#F7F0EE;
  --accent:#D9796C; --accent-ink:#FFFFFF;
  --blush:#F3D3CF; --peach:#F6DCC2; --sage:#B7D3CC; --mint:#E1EEE9; --lav:#E2DAF0;
  --c-linkedin:#8EAFD3; --c-meta:#BCA6DD; --c-newsletter:#E3C27F; --c-emailing:#E7A6BC; --c-ferias:#EFAE86; --c-webinars:#93C8BB; --c-website:#B5AEB0; --c-youtube:#E19592;
  --shadow:0 1px 2px rgba(90,60,60,.04), 0 10px 28px rgba(120,80,80,.07);
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1D1A1C; --surface:#262224; --ink:#F2EAE8; --muted:#A99FA1; --line:#3A3335; --soft:#2E292B;
    --accent:#E99A8D; --accent-ink:#1D1A1C; --blush:#4A3535; --peach:#4A3D30; --sage:#2F4440; --mint:#283632; --lav:#383145;
    --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#1D1A1C; --surface:#262224; --ink:#F2EAE8; --muted:#A99FA1; --line:#3A3335; --soft:#2E292B;
  --accent:#E99A8D; --accent-ink:#1D1A1C; --blush:#4A3535; --peach:#4A3D30; --sage:#2F4440; --mint:#283632; --lav:#383145;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 10px 28px rgba(0,0,0,.25);
}
body{background:var(--paper); letter-spacing:.005em}
.app{grid-template-columns:248px 1fr}
.rail{background:transparent; border-right:0; padding:26px 18px}
.brand h1{font-weight:700; font-size:18px; letter-spacing:-.01em}
.strip button{height:8px; border-radius:999px}
.nav{gap:3px}
.nav .group{font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:16px 12px 6px}
.nav button{border-radius:999px; padding:9px 14px; font-size:14px; color:var(--muted)}
.nav button:hover{background:var(--surface); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:var(--shadow)}
.dot{width:8px; height:8px; border-radius:50%}
.nav .count{background:var(--blush); color:var(--ink); border-radius:999px; padding:1px 8px; font-size:11px}
main{padding:34px clamp(18px,3.4vw,48px) 64px}
.head h2{font-weight:700; font-size:clamp(26px,2.8vw,34px); letter-spacing:-.02em}
.head p{font-size:14.5px}
/* surfaces */
.composer,.side .panel,.out,.rel .form,.ct .form,.pack .form,.fair .form,.fcard,.pcard,.mform,.linkform,.calwrap,.folders,.report,.plan,.kpi,.src,.mcard,.asset,.ccard,.msg.ai,.visual,.idea,.table,.drop,.libdrop,.cdtip,.sw,.dodont .box,.names div{
  border:1px solid var(--line) !important; border-radius:20px !important; box-shadow:var(--shadow); background:var(--surface)}
.table{overflow:hidden}
.msg.user{background:var(--blush); border-radius:20px 20px 6px 20px}
.msg.ai{border-radius:20px 20px 20px 6px !important}
.msg.design{border-style:dashed !important; border-color:var(--accent) !important}
.msg.asks{border-color:var(--accent) !important}
.reply{border-radius:22px; border:1px solid var(--line); box-shadow:0 12px 36px rgba(120,80,80,.12)}
.reply.ask{box-shadow:0 0 0 2px var(--accent), 0 12px 36px rgba(120,80,80,.12)}
/* controls */
.btn{border-radius:999px; border:1px solid var(--line); background:var(--surface); padding:9px 18px; font-weight:600; box-shadow:0 1px 2px rgba(90,60,60,.05)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn.primary:hover{filter:none; background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.ghost{background:transparent; box-shadow:none; border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:6px 13px}
select,input[type=text],input[type=url],input[type=number],input[type=date],input[type=search],textarea{border-radius:14px !important; border:1px solid var(--line) !important; background:var(--soft) !important}
textarea:focus,input:focus,select:focus{outline:none; border-color:var(--accent) !important; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.type{border-radius:16px; border:1px solid var(--line); background:var(--soft)}
.type[aria-pressed="true"]{background:var(--blush); border-color:transparent; box-shadow:none}
.pchip{border-radius:999px; border:1px solid var(--line); background:var(--soft)}
.pchip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.agentbar{background:var(--mint); border-radius:16px}
.quick button{border-radius:14px; border:0; background:var(--soft)}
.quick button:hover{background:var(--peach)}
.tabs{border-bottom:0; gap:6px}
.tabs button{border-radius:999px; border-bottom:0; padding:8px 16px; background:transparent}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
.langsw{border-radius:999px}
/* calendar */
.cal .dow{border-bottom:1px solid var(--line); text-transform:uppercase; font-size:11px; letter-spacing:.06em}
.cal .day{border-color:var(--line)}
.cal .day.out{background:var(--soft)}
.cal .day.today .n b{background:var(--accent); border-radius:999px; padding:1px 7px}
.chip{border-radius:10px; border-left-width:4px; background:var(--soft)}
/* KPIs with pastel fills */
.kpis .kpi{border:0 !important}
.kpis .kpi:nth-child(5n+1){background:var(--blush)}
.kpis .kpi:nth-child(5n+2){background:var(--sage)}
.kpis .kpi:nth-child(5n+3){background:var(--peach)}
.kpis .kpi:nth-child(5n+4){background:var(--lav)}
.kpis .kpi:nth-child(5n+5){background:var(--mint)}
.kpi .v{font-weight:700}
.notice{border-left:0; border-radius:16px; background:var(--peach)}
.core{background:var(--mint); border-radius:18px}
.folders .f{border-radius:999px}
.folders .f[aria-current="true"]{background:var(--blush)}
.ccard .cthumb,.asset .thumb{background:var(--soft)}
.pv{border-radius:18px}
.toast{border-radius:999px; padding:10px 20px}
dialog{border-radius:24px; border:0; box-shadow:0 30px 80px rgba(60,30,30,.25)}
.dlg{padding:24px 26px}
.picon{border-radius:6px}
.langsw.themesw{display:flex; width:100%; margin-top:2px}
.langsw.themesw button{flex:1 1 0; padding:5px 2px; font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis}

/* ===== Lavender glass theme (v3) ===== */

    --accent:#FF5C8A; --accent-soft:#5A2D44; --accent-ink:#FFFFFF; --indigo:#8B86FF;
    --lilac:#3A3670; --mint:#24453A; --butter:#4A4425; --blush:#4C2C3D; --peach:#4A3529; --sage:#25403A; --lav:#363263;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#1E1B35; --bg2:#272243; --bg3:#3A2A45;
  --surface:#26233D; --ink:#F1EFFB; --muted:#A8A4C4; --line:#38345A; --soft:#2F2B4A;
  --glass:rgba(255,255,255,.06); --glass-strong:rgba(255,255,255,.10); --pill-base:#2F2B4A; --pill-ink:#F1EFFB; --glass-line:rgba(255,255,255,.12); --on-glass:#F1EFFB; --on-glass-muted:rgba(241,239,251,.7);
  --accent:#FF5C8A; --accent-soft:#5A2D44; --accent-ink:#FFFFFF; --indigo:#8B86FF;
  --lilac:#3A3670; --mint:#24453A; --butter:#4A4425; --blush:#4C2C3D; --peach:#4A3529; --sage:#25403A; --lav:#363263;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.35); color-scheme:dark;
}
html{background:var(--bg1)}
body{font-family:var(--font); font-size:15px; letter-spacing:0; color:var(--ink);
  background:linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 46%, var(--bg3) 100%) fixed; min-height:100vh}
h1,h2,h3,h4{font-family:var(--font)}

/* Shell */
.app{display:grid; grid-template-columns:268px minmax(0,1fr); min-height:100vh; transition:grid-template-columns .25s}
body.rail-mini .app{grid-template-columns:92px minmax(0,1fr)}
.rail{position:sticky; top:0; height:100vh; margin:0; padding:22px 14px 18px; background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(40,32,96,.22)); backdrop-filter:blur(22px) saturate(1.2); -webkit-backdrop-filter:blur(22px) saturate(1.2);
  border-right:1px solid var(--glass-line); color:var(--on-glass); gap:14px; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin}
.brand{padding:0 8px; gap:6px}
.brandrow{display:flex; align-items:center; gap:10px; justify-content:space-between}
.mark{width:42px; height:42px; border-radius:14px; background:var(--surface); color:var(--accent); display:grid; place-items:center; flex:none; box-shadow:var(--shadow)}
.mark svg{width:24px; height:24px}
.brand h1{font-size:17px; font-weight:700; color:var(--on-glass); line-height:1.15}
.brand small{color:var(--on-glass-muted); font-size:12.5px}
#brandBox{display:flex; align-items:center; gap:10px; min-width:0}
#brandBox .bt{min-width:0}
#brandLogo{margin:0 !important}
.strip{display:none}
.collapse{border:0; background:transparent; color:var(--on-glass-muted); width:30px; height:30px; border-radius:10px; display:grid; place-items:center; flex:none}
.collapse:hover{background:var(--glass-strong); color:var(--on-glass)}
.collapse svg{width:18px; height:18px; transition:transform .25s}
body.rail-mini .collapse svg{transform:rotate(180deg)}
.nav{gap:2px}
.nav .group{font-size:12px; letter-spacing:0; text-transform:none; color:var(--on-glass-muted); padding:14px 12px 4px; font-weight:600}
.nav button{gap:12px; padding:9px 12px; border-radius:14px; font-size:14.5px; font-weight:550; color:var(--on-glass); background:transparent; box-shadow:none; min-height:42px}
.nav button:hover{background:var(--glass-strong); color:var(--on-glass)}
.nav button[aria-current="page"]{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:var(--shadow)}
.nav .ic{width:22px; height:22px; flex:none; display:grid; place-items:center}
.nav .ic svg{width:20px; height:20px}
.nav .cdot{width:12px; height:12px; border-radius:5px; box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.nav .lbl{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left}
.nav .count{background:var(--accent); color:#fff; border-radius:999px; padding:0 7px; font-size:11px; font-weight:700; line-height:18px}
.nav button[aria-current="page"] .count{background:var(--accent)}
.rail .foot{color:var(--on-glass-muted); font-size:12px; padding:10px 8px 0; border-top:1px solid var(--glass-line)}
.rail .foot .langsw{border-color:var(--glass-line)}
.rail .foot .langsw button{color:var(--on-glass-muted)}
.rail .foot .langsw button[aria-pressed="true"]{background:var(--surface); color:var(--ink)}
body.rail-mini .rail{padding:22px 12px}
body.rail-mini .brand small, body.rail-mini #brandBox .bt, body.rail-mini .nav .lbl, body.rail-mini .nav .count, body.rail-mini .nav .group, body.rail-mini .rail .foot{display:none}
@media (max-width:760px){ body.rail-mini .rail .foot{display:block} body.rail-mini .nav .lbl, body.rail-mini .nav .group{display:revert} }
body.rail-mini .brandrow{flex-direction:column}
body.rail-mini .nav button{justify-content:center; padding:10px}
body.rail-mini .nav .sep{display:block}
.nav .sep{display:none; height:1px; background:var(--glass-line); margin:8px 10px}

.content{min-width:0; display:flex; flex-direction:column}
.topbar{display:none}
main{padding:30px clamp(16px,3vw,44px) 70px; min-width:0}
.head{margin-bottom:22px; color:var(--on-glass)}
.head h2{font-size:clamp(28px,3.4vw,42px); font-weight:700; letter-spacing:-.02em; color:var(--on-glass)}
.head p{color:var(--on-glass-muted); font-size:15px}
.list > h3, .kit h3, .side h3{color:inherit}

/* Surfaces */
.composer,.side .panel,.out,.rel .form,.ct .form,.pack .form,.fair .form,.fcard,.pcard,.mform,.linkform,.calwrap,.folders,.report,.plan,.kpi,.src,.mcard,.asset,.ccard,.msg.ai,.visual,.idea,.table,.drop,.libdrop,.cdtip,.sw,.dodont .box,.names div{
  border:1px solid transparent !important; border-radius:var(--r-card) !important; box-shadow:var(--shadow); background:var(--surface)}
/* every view (except the dashboard) sits on one surface sheet so text never lands on the gradient */
.sheet{background:var(--surface); color:var(--ink); border-radius:30px; padding:clamp(16px,2.4vw,30px); box-shadow:var(--shadow); min-width:0}
.sheet .composer,.sheet .side .panel,.sheet .out,.sheet .rel .form,.sheet .ct .form,.sheet .pack .form,.sheet .fair .form,.sheet .fcard,.sheet .pcard,.sheet .mform,.sheet .linkform,.sheet .calwrap,.sheet .folders,.sheet .report,.sheet .plan,.sheet .src,.sheet .mcard,.sheet .asset,.sheet .ccard,.sheet .msg.ai,.sheet .visual,.sheet .idea,.sheet .table,.sheet .drop,.sheet .libdrop,.sheet .cdtip,.sheet .sw,.sheet .dodont .box,.sheet .names div{
  box-shadow:none; border:1px solid var(--line) !important; border-radius:22px !important}
.sheet .kpis .kpi{border:0 !important; box-shadow:none; border-radius:20px !important}
.sheet .list:first-child{margin-top:0}
.table{border-radius:18px !important}
.table th{background:var(--soft); color:var(--muted); font-weight:600}
.msg.user{background:var(--lilac); color:var(--ink); border-radius:22px 22px 8px 22px}
.reply{border-radius:24px; border:0; box-shadow:0 18px 44px rgba(40,30,90,.22); background:var(--surface)}
.reply.ask{box-shadow:0 0 0 2px var(--accent), 0 18px 44px rgba(40,30,90,.22)}
.notice{background:var(--butter); color:var(--ink); border-radius:18px}
.core{background:var(--mint); color:var(--ink)}
.agentbar{background:var(--lilac); color:var(--ink)}

/* Controls */
.btn{border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 18px; font-weight:650; box-shadow:none; min-height:38px}
.btn:hover{border-color:var(--indigo); color:var(--ink)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{background:var(--accent); border-color:var(--accent); color:#fff; filter:none}
.btn.ghost{background:transparent; border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:6px 14px; min-height:32px}
.head .btn{background:var(--glass-strong); border-color:var(--glass-line); color:var(--on-glass); backdrop-filter:blur(10px)}
.head .btn:hover{background:var(--surface); color:var(--ink)}
.head .btn.primary{background:var(--surface); color:var(--ink); border-color:var(--surface)}
.head .btn.primary:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
select,input[type=text],input[type=url],input[type=number],input[type=date],input[type=search],textarea{border-radius:14px !important; border:1px solid var(--line) !important; background:var(--soft) !important; color:var(--ink)}
textarea:focus,input:focus,select:focus{outline:none; border-color:var(--indigo) !important; box-shadow:0 0 0 3px color-mix(in srgb, var(--indigo) 22%, transparent)}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.pchip{background:var(--soft); border-color:var(--line); color:var(--ink)}
.pchip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.type{background:var(--soft); border-color:transparent; border-radius:18px}
.type[aria-pressed="true"]{background:var(--lilac); border-color:var(--indigo); box-shadow:inset 0 0 0 1px var(--indigo)}
.tabs button{color:inherit}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--surface)}
.kpis .kpi{color:var(--ink)}
.kpis .kpi:nth-child(5n+1){background:var(--blush)}
.kpis .kpi:nth-child(5n+2){background:var(--lilac)}
.kpis .kpi:nth-child(5n+3){background:var(--mint)}
.kpis .kpi:nth-child(5n+4){background:var(--butter)}
.kpis .kpi:nth-child(5n+5){background:var(--peach)}
.cal .day.today .n b{background:var(--indigo); color:#fff}
.chip{border-radius:10px}
dialog{border-radius:28px; background:var(--surface); color:var(--ink); box-shadow:0 40px 90px rgba(30,20,80,.35)}
dialog::backdrop{background:rgba(35,32,58,.4); backdrop-filter:blur(4px)}
.toast{background:var(--ink); color:var(--surface)}
.folders .f[aria-current="true"]{background:var(--lilac)}

/* ===== Dashboard ===== */
.dash-head{display:flex; flex-wrap:wrap; align-items:center; gap:14px 18px; margin-bottom:24px; color:var(--on-glass)}
.dash-head h2{margin:0; font-size:clamp(30px,4vw,46px); font-weight:700; letter-spacing:-.025em; line-height:1}
.dash-head .date{color:var(--on-glass-muted); font-size:15px; margin-top:6px}
.seg{display:inline-flex; background:var(--glass-strong); border:1px solid var(--glass-line); border-radius:999px; padding:4px; backdrop-filter:blur(10px)}
.seg button{border:0; background:transparent; color:var(--on-glass); padding:8px 16px; border-radius:999px; font-weight:600; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.dash-head .acts{margin-left:auto; display:flex; gap:10px; align-items:center}
.roundbtn{width:46px; height:46px; border-radius:50%; border:1px solid var(--glass-line); background:var(--glass-strong); color:var(--on-glass); display:grid; place-items:center; backdrop-filter:blur(10px)}
.roundbtn:hover{background:var(--surface); color:var(--ink)}
.roundbtn svg{width:20px; height:20px}
.pillbtn{border-radius:999px; border:1px solid var(--glass-line); background:var(--glass-strong); color:var(--on-glass); padding:0 18px; height:46px; display:inline-flex; align-items:center; gap:8px; font-weight:650; backdrop-filter:blur(10px)}
.pillbtn:hover{background:var(--surface); color:var(--ink)}
.pillbtn.on{background:var(--surface); color:var(--ink)}
.pillbtn svg{width:18px; height:18px}

.dgrid{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:20px; grid-auto-flow:row dense; align-items:stretch}
.wd{grid-column:span 4; border-radius:var(--r-card); padding:20px 22px; min-width:0; position:relative; display:flex; flex-direction:column; gap:12px; min-height:200px}
.wd.s3{grid-column:span 3} .wd.s4{grid-column:span 4} .wd.s6{grid-column:span 6} .wd.s8{grid-column:span 8} .wd.s12{grid-column:span 12}
.wd.white{background:var(--surface); box-shadow:var(--shadow); color:var(--ink)}
.wd.glass{background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15); color:var(--on-glass)}
.wd.glass .muted{color:var(--on-glass-muted)}
.wd .muted{color:var(--muted)}
.wd-h{display:flex; align-items:center; gap:10px; min-height:30px}
.wd-h h3{margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:22px; font-weight:700; letter-spacing:-.01em; line-height:1.1}
.wd-h .more{margin-left:auto; border:0; background:transparent; color:inherit; opacity:.75; width:32px; height:32px; border-radius:10px; display:grid; place-items:center}
.wd-h .more:hover{opacity:1; background:color-mix(in srgb, currentColor 10%, transparent)}
.wd-h .more svg{width:18px; height:18px}
.trend{white-space:nowrap; flex:none; display:inline-flex; align-items:center; gap:5px; font-weight:700; font-size:14px; margin-left:auto}
.trend i{width:20px; height:20px; border-radius:50%; display:grid; place-items:center; color:#fff; font-style:normal; font-size:11px}
.trend.up i{background:#2EAE5B} .trend.down i{background:var(--accent)}
.wd-empty{margin:auto 0; font-size:14px}
.wd-empty .btn{margin-top:10px}

/* bars widget */
.bars{display:grid; grid-template-columns:46px 1fr; gap:6px; flex:1; min-height:150px}
.bars .ax{white-space:nowrap; display:flex; flex-direction:column; justify-content:space-between; font-size:11.5px; color:var(--muted); padding:2px 0 18px}
.bars .cols{display:grid; grid-template-columns:repeat(12,1fr); align-items:end; gap:5px; position:relative; padding-bottom:18px;
  background:repeating-linear-gradient(to top, transparent 0, transparent calc(25% - 1px), var(--line) calc(25% - 1px), var(--line) 25%) 0 0 / 100% calc(100% - 18px) no-repeat}
.bars .col{position:relative; height:100%; display:flex; align-items:flex-end; justify-content:center}
.bars .col b{display:block; width:min(12px,70%); border-radius:999px; background:var(--accent); min-height:4px}
.bars .col:nth-child(even) b{background:var(--accent-soft)}
.bars .col.future b{background:var(--soft)}
.bars .col span{position:absolute; bottom:-18px; font-size:10.5px; color:var(--muted)}
.big{font-size:28px; font-weight:700; letter-spacing:-.02em; line-height:1}
.prog{height:8px; border-radius:999px; background:var(--soft); overflow:hidden}
.prog i{display:block; height:100%; border-radius:inherit; background:var(--accent)}
.wd.glass .prog{background:rgba(255,255,255,.25)}
.wd.glass .prog i{background:var(--surface)}

/* team rows */
.rows{display:flex; flex-direction:column; gap:4px}
.prow{display:grid; grid-template-columns:44px minmax(0,1fr) auto auto 20px; gap:12px; align-items:center; padding:8px 6px; border-radius:16px; border:0; background:transparent; color:inherit; text-align:left; width:100%}
.prow:hover{background:var(--glass-strong)}
.wd.white .prow:hover{background:var(--soft)}
.avatar{width:42px; height:42px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:15px; color:#2A2550; box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.prow .nm{font-weight:650; font-size:15px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.prow .sb{font-size:12.5px; opacity:.78; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tagp{font-size:12.5px; font-weight:650; border-radius:999px; padding:3px 11px; color:#2A2550; white-space:nowrap}
.prow .val{font-weight:600; font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums}
.prow svg{width:16px; height:16px; opacity:.8}

/* checklist note */
.wd.note{background:var(--surface); box-shadow:var(--shadow); color:var(--ink); transform:rotate(1.2deg)}
.wd.note:hover{transform:none}
.checks{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none}
.checks li{display:flex; align-items:center; gap:10px; font-size:15px}
.checks input[type=checkbox]{width:18px; height:18px; accent-color:var(--indigo); flex:none}
.checks li.done span{text-decoration:line-through; color:var(--muted)}
.checks .x{margin-left:auto; border:0; background:transparent; color:var(--muted); opacity:0; font-size:18px; line-height:1}
.checks li:hover .x,.checks .x:focus-visible{opacity:1}
.addcheck{display:flex; gap:8px; margin-top:auto}
.addcheck input{flex:1; min-width:0; padding:8px 12px; font-size:14px}
.stack{display:flex; margin-top:auto}
.stack .avatar{width:36px; height:36px; font-size:13px; margin-left:-8px}
.stack .avatar:first-child{margin-left:0}

/* timeline */
.wd.tl{padding:0; overflow:hidden; gap:0; background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(18px)}
.tl-h{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:16px 22px; color:var(--on-glass)}
.tl-h h3{margin:0; font-size:26px; font-weight:700; letter-spacing:-.015em}
.tl-h .muted{color:var(--on-glass-muted); font-size:14px}
.tl-h .search{margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--glass-strong); border:1px solid var(--glass-line); border-radius:999px; padding:0 14px; height:40px; min-width:min(240px,100%)}
.tl-h .search svg{width:16px; height:16px; opacity:.8}
.tl-h .search input{border:0 !important; background:transparent !important; color:var(--on-glass); padding:0; height:100%; flex:1; min-width:0; box-shadow:none !important}
.tl-h .search input::placeholder{color:var(--on-glass-muted)}
.tl-b{display:grid; grid-template-columns:230px minmax(0,1fr); background:var(--surface); color:var(--ink); min-height:300px}
.tl-side{background:var(--soft); padding:16px 18px; display:flex; flex-direction:column; gap:8px; font-size:14px}
.tl-side .k{color:var(--muted); font-size:13px}
.tl-side .st{display:flex; align-items:center; gap:8px}
.tl-side .st b{margin-left:auto; font-variant-numeric:tabular-nums}
.tl-side .st i{width:9px; height:9px; border-radius:50%}
.tl-side .create{margin-top:auto; border:0; background:transparent; display:flex; align-items:center; gap:10px; font-weight:650; padding:6px 0; color:var(--ink)}
.tl-side .create span{width:22px; height:22px; border-radius:50%; background:var(--indigo); color:#fff; display:grid; place-items:center; font-size:15px}
.tl-scroll{overflow-x:auto}
.tl-grid{position:relative; min-width:840px; padding:0 0 18px}
.tl-days{display:grid; grid-template-columns:repeat(14,1fr); font-size:12.5px; color:var(--muted); padding:12px 0 8px}
.tl-days div{text-align:center; white-space:nowrap}
.tl-days div.today b{background:var(--indigo); color:#fff; border-radius:7px; padding:2px 7px; font-weight:600}
.tl-days div.we{opacity:.6}
.tl-lines{position:absolute; inset:40px 0 0 0; display:grid; grid-template-columns:repeat(14,1fr); pointer-events:none}
.tl-lines div{border-left:1px solid var(--line)}
.tl-lines div.today{border-left:1.5px solid var(--indigo)}
.tl-lanes{position:relative; display:flex; flex-direction:column; gap:10px; padding-top:6px}
.tl-lane{display:grid; grid-template-columns:repeat(14,1fr); min-height:34px}
.tl-pill{border:0; border-radius:999px; height:34px; padding:0 14px; display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:var(--pill-ink); min-width:0; text-align:left; box-shadow:0 1px 0 rgba(0,0,0,.03); margin:0 3px}
.tl-pill span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1}
.tl-pill i{width:8px; height:8px; border-radius:50%; flex:none; background:currentColor; opacity:.55}
.tl-pill:hover{filter:brightness(.97); box-shadow:0 6px 16px rgba(60,50,120,.15)}
.tl-more{font-size:13px; color:var(--muted); padding:4px 18px 0}
.tl-more button{border:0; background:transparent; color:var(--indigo); font-weight:650; padding:0}

/* status / generic list */
.slist{display:flex; flex-direction:column; gap:10px}
.srow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; font-size:14px; align-items:center}
.srow .prog{grid-column:1 / -1; height:7px}
.ilist{display:flex; flex-direction:column; gap:6px; margin:0; padding:0; list-style:none}
.ilist button{all:unset; cursor:pointer; display:grid; grid-template-columns:10px 1fr; gap:10px; align-items:start; padding:6px 8px; border-radius:12px}
.ilist button:hover{background:var(--soft)}
.ilist .dt{width:9px; height:9px; border-radius:50%; margin-top:6px}
.ilist .t{font-size:14px; line-height:1.35}
.ilist .m{font-size:12px; color:var(--muted)}
.qgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.qbtn{border:0; border-radius:20px; padding:14px; text-align:left; display:flex; flex-direction:column; gap:10px; font-weight:650; font-size:14px; color:#2A2550; min-height:92px}
.qbtn svg{width:22px; height:22px}
.qbtn:hover{filter:brightness(.97); box-shadow:0 8px 20px rgba(60,50,120,.14)}
.sparks{display:flex; align-items:flex-end; gap:5px; height:90px}
.sparks b{flex:1; border-radius:6px 6px 3px 3px; background:var(--surface); opacity:.9; min-height:4px}
.wd.white .sparks b{background:var(--accent)}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stats div{font-size:12.5px} .stats b{display:block; font-size:20px; font-weight:700}

/* edit mode */
.editbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--surface); color:var(--ink); border-radius:22px; padding:12px 16px; margin-bottom:18px; box-shadow:var(--shadow)}
.editbar p{margin:0; font-size:14px; color:var(--muted); flex:1 1 260px}
.dgrid.editing .wd{outline:2px dashed var(--glass-line); outline-offset:4px; cursor:grab}
.dgrid.editing .wd.dragging{opacity:.4}
.dgrid.editing .wd.over{outline-color:var(--indigo); outline-style:solid}

/* ===== Liquid Glass (v4) ===== */
:root{
  --bgL1:#F29B6C; --bgL2:#F6BE8F; --bgL3:#F7E7C6; --bgD1:#2A1C17; --bgD2:#33231C; --bgD3:#3D2D22;
  --onL:#2A1B14; --onL-muted:rgba(42,27,20,.72);
  --bg1:var(--bgL1); --bg2:var(--bgL2); --bg3:var(--bgL3); --on-bg:var(--onL); --on-bg-muted:var(--onL-muted);
  --lg-fill:linear-gradient(150deg, rgba(255,255,255,.68) 0%, rgba(255,255,255,.44) 100%);
  --lg-fill-2:linear-gradient(150deg, rgba(255,255,255,.52) 0%, rgba(255,255,255,.28) 100%);
  --lg-inner:rgba(255,255,255,.44); --lg-edge:rgba(255,255,255,.72); --lg-hi:rgba(255,255,255,.95); --lg-lo:rgba(255,255,255,.32);
  --lg-drop:0 14px 36px rgba(40,20,10,.13), 0 2px 6px rgba(40,20,10,.06);
  --lg-blur:blur(28px) saturate(185%);
  --line:rgba(40,25,60,.10); --soft:rgba(255,255,255,.52);
  --pill-base:rgba(255,255,255,.8); --pill-ink:#2A2550;
  --on-glass:var(--ink); --on-glass-muted:var(--muted); --glass-line:rgba(255,255,255,.7); --glass-strong:rgba(255,255,255,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:var(--bgD1); --bg2:var(--bgD2); --bg3:var(--bgD3); --on-bg:#F4F2FB; --on-bg-muted:rgba(244,242,251,.74);
    --lg-fill:linear-gradient(150deg, rgba(60,56,86,.62) 0%, rgba(34,32,54,.46) 100%);
    --lg-fill-2:linear-gradient(150deg, rgba(70,66,96,.45) 0%, rgba(40,38,60,.28) 100%);
    --lg-inner:rgba(255,255,255,.05); --lg-edge:rgba(255,255,255,.15); --lg-hi:rgba(255,255,255,.22); --lg-lo:rgba(255,255,255,.05);
    --lg-drop:0 16px 40px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.2);
    --line:rgba(255,255,255,.10); --soft:rgba(255,255,255,.07); --pill-base:rgba(40,38,62,.85); --pill-ink:#F1EFFB;
    --glass-line:rgba(255,255,255,.15); --glass-strong:rgba(255,255,255,.1);
  }
}
:root[data-theme="dark"]{
  --bg1:var(--bgD1); --bg2:var(--bgD2); --bg3:var(--bgD3); --on-bg:#F4F2FB; --on-bg-muted:rgba(244,242,251,.74);
  --lg-fill:linear-gradient(150deg, rgba(60,56,86,.62) 0%, rgba(34,32,54,.46) 100%);
  --lg-fill-2:linear-gradient(150deg, rgba(70,66,96,.45) 0%, rgba(40,38,60,.28) 100%);
  --lg-inner:rgba(255,255,255,.05); --lg-edge:rgba(255,255,255,.15); --lg-hi:rgba(255,255,255,.22); --lg-lo:rgba(255,255,255,.05);
  --lg-drop:0 16px 40px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.2);
  --line:rgba(255,255,255,.10); --soft:rgba(255,255,255,.07); --pill-base:rgba(40,38,62,.85); --pill-ink:#F1EFFB;
  --glass-line:rgba(255,255,255,.15); --glass-strong:rgba(255,255,255,.1);
}
html{background:var(--bg1)}
body{background:
  radial-gradient(55vw 45vh at 88% 4%, color-mix(in srgb, var(--bg3) 85%, transparent), transparent 72%),
  radial-gradient(48vw 42vh at 6% 96%, color-mix(in srgb, var(--bg2) 90%, white 10%), transparent 70%),
  radial-gradient(36vw 30vh at 42% 58%, color-mix(in srgb, var(--bg1) 70%, white 30%), transparent 72%),
  linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%);
  background-attachment:fixed}

/* Floating glass boxes (they blur what is behind them) */
.rail,.sheet,.wd,.wd.white,.wd.glass,.wd.note,.wd.tl,.editbar,.tabbar,.topbar,dialog,.reply,.pillbtn,.roundbtn,.seg,.addtray button,.head .btn,.toast{
  background:var(--lg-fill) !important; -webkit-backdrop-filter:var(--lg-blur); backdrop-filter:var(--lg-blur);
  border:1px solid var(--lg-edge) !important;
  box-shadow:inset 0 1px 0 var(--lg-hi), inset 0 -1px 1px var(--lg-lo), inset 1px 0 0 var(--lg-lo), var(--lg-drop) !important;
  color:var(--ink)}
dialog{background:linear-gradient(150deg, rgba(255,255,255,.86), rgba(255,255,255,.72)) !important}
:root[data-theme="dark"] dialog{background:linear-gradient(150deg, rgba(52,48,78,.92), rgba(34,32,54,.86)) !important}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) dialog{background:linear-gradient(150deg, rgba(52,48,78,.92), rgba(34,32,54,.86)) !important} }
.toast{color:var(--ink) !important; font-weight:600}
.wd.glass{background:linear-gradient(150deg, color-mix(in srgb, var(--bg1) 26%, rgba(255,255,255,.5)), rgba(255,255,255,.26)) !important}
.wd.glass,.wd.glass .muted,.wd.tl,.tl-h,.tl-h .muted{color:var(--ink)}
.wd.glass .muted,.tl-h .muted{color:var(--muted) !important}
.wd.glass .prog{background:var(--soft)} .wd.glass .prog i{background:var(--accent)}
.wd.glass .prow:hover,.wd.white .prow:hover{background:rgba(255,255,255,.45)}
.sparks b,.wd.white .sparks b{background:linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, white))}
.wd.note{background:linear-gradient(150deg, rgba(255,255,255,.8), rgba(255,255,255,.58)) !important}

/* Rail: floating glass sidebar */
.rail{position:sticky; top:12px; margin:12px 0 12px 12px; height:calc(100vh - 24px); border-radius:30px; padding:20px 12px 16px; color:var(--ink)}
/* Rail scrollbar: thin, translucent glass thumb */
.rail{scrollbar-width:auto; scrollbar-color:auto}

.rail::-webkit-scrollbar-track{background:transparent; margin:28px 0}
.rail::-webkit-scrollbar-thumb{border:4px solid transparent; border-radius:999px; background-clip:padding-box; background-color:rgba(40,25,60,.10); background-image:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.rail:hover::-webkit-scrollbar-thumb{background-color:rgba(40,25,60,.22)}
.rail::-webkit-scrollbar-thumb:hover{background-color:rgba(40,25,60,.34)}
.rail::-webkit-scrollbar-thumb:active{background-color:rgba(40,25,60,.44)}
.rail::-webkit-scrollbar-corner,.rail::-webkit-scrollbar-button{display:none; background:transparent}
@supports (-moz-appearance:none){ .rail{scrollbar-width:thin; scrollbar-color:rgba(40,25,60,.24) transparent} }
:root[data-theme="dark"] .rail::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.10); background-image:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
:root[data-theme="dark"] .rail:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.22)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .rail::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.10); background-image:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  :root:not([data-theme="light"]) .rail:hover::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.22)}
}

(function(){ const d = document.getElementById("dlg"); let downOut = false;
  const outside = e => { const r = d.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
  d.addEventListener("mousedown", e => { downOut = e.target === d && outside(e); });
  d.addEventListener("click", e => { if (downOut && e.target === d && outside(e)) d.close(); downOut = false; });
})();

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()){
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}

function markerGate(text, status){

      h("ul",{class:"mk-list"}, list.slice(0, 6).map(m => h("li",null, h("code",null, m)))),
      h("div",{class:"row", style:{flexWrap:"wrap"}},
        h("button",{class:"btn ghost danger", onclick:()=>finish("force")}, "Forzar de todos modos"),

        h("button",{class:"btn ghost", onclick:()=>finish("cancel")}, "Seguir editando"),

    d.onclose = () => finish("cancel");

function markerPanel(ta){

// The agents end every draft with "Supuestos / Preguntas abiertas / Siguiente paso": useful in the chat, not in the saved piece
function stripLeadIn(text){
  const t = String(text || ""), parts = t.split(/\n\s*\n/);
  if (parts.length < 2) return t;
  const first = parts[0].trim();
  if (first.length < 260 && !/\n/.test(first) && /^(I'?ll|I will|Let me|First,? I|Voy a|Primero|Antes de (escribir|redactar)|Consulto|Reviso|Compruebo|Busco)\b/i.test(first)) return parts.slice(1).join("\n\n");
  return t;
}
function stripClosing(text){
  const t = stripLeadIn(text);
  const re = /\n[ \t]*(?:[-*_]{3,}[ \t]*\n[ \t]*)?(?:\*\*)?(?:Supuestos|Suposiciones|Assumptions)(?:\*\*)?\s*:/i;
  const m = t.match(re); if (!m) return t;
  const rest = t.slice(m.index);
  if (!/(Preguntas abiertas|Open questions|Siguiente paso|Next step)/i.test(rest)) return t;
  return t.slice(0, m.index).replace(/\s+$/, "");
}

function trMap(){ const m = Object.assign({}, BUILTIN_EN, S.i18n || {}); if (S.uiLang === "en") return m; if (!S._rev){ S._rev = {}; Object.entries(m).forEach(([k,v]) => { if (v) S._rev[v] = k; }); } return S._rev; }
function trNode(root){
  if (!root) return;
  if (S.uiLang !== "en" && !S._wasEn) return;
  const map = trMap(); if (!map) return;
  const fix = node => { const raw = node.nodeValue, t = raw.trim(); if (!t) return; const v = map[t]; if (v && v !== t) node.nodeValue = raw.replace(t, v); };
  if (root.nodeType === 3) { fix(root); return; }
  if (root.nodeType !== 1) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement && /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentElement.tagName) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  let n; while ((n = w.nextNode())) fix(n);
  const els = root.querySelectorAll ? [root, ...root.querySelectorAll("[placeholder],[title],[aria-label]")] : [];
  els.forEach(el => { ["placeholder","title","aria-label"].forEach(a => { const v = el.getAttribute && el.getAttribute(a); if (v && map[v.trim()]) el.setAttribute(a, map[v.trim()]); }); });
}
async function ensureEnglish(){
  const have = S.i18n || {};
  const missing = UI_STRINGS.filter(k => !(k in have));
  if (!missing.length) return true;
  if (!S.sample) { toast("Para traducir la interfaz, abre la página publicada en claude.ai"); return false; }
  const bar = document.getElementById("toast"); 
  try {
    const out = Object.assign({}, have);
    for (let i = 0; i < missing.length; i += 120){
      const chunk = missing.slice(i, i + 120);
      toast(`Translating the interface (first time only)… ${Math.min(100, Math.round(i / missing.length * 100))} %`);
      const r = await S.sample.json(`Translate these Spanish user-interface strings of a B2B marketing app (Inèdit Software, textile printing) into natural, concise English for the interface. Keep product and brand names (neoStampa, neoTextil, neoCatalog, neoMatch, Inèdit, Fiery, Canva, Claude Design, Windsor.ai, OneDrive, Salesforce), keyboard symbols, numbers, quotes and leading/trailing punctuation exactly. Keep any placeholder-like fragments. If a string is an instruction to an AI, translate it faithfully too.
Return ONLY a JSON object {"t":[...]} with exactly ${chunk.length} strings, in the same order.
${JSON.stringify(chunk)}`, {cache:false, modelTier:"default"});
      const arr = r && Array.isArray(r.t) ? r.t : [];
      chunk.forEach((k, j) => { out[k] = typeof arr[j] === "string" && arr[j].trim() ? arr[j].trim() : k; });
    }
    S.i18n = out; S._rev = null;
    if (S.db) { try { await S.db.collection("config").doc("i18n-en").set({map:out, updatedAt:Date.now(), count:Object.keys(out).length}); } catch(e){} }
    return true;
  } catch(e){ toast(e && e.code === "rate_limited" ? "Too many requests. Try again in a minute." : "No se ha podido traducir la interfaz. Vuelve a intentarlo."); return false; }
}

const BACKUP_COLS = [["items","Calendario"],["tasks","Tareas"],["content","Contenidos"],["ideas","Ideas"],["library","Portal"],["folders","Carpetas"],["models","Piezas modelo"],["releases","Notas de versión"],["companytexts","Textos de empresa"],["designreq","Encargos de diseño"],["reports","Informes"],["metrics","Resultados redes"],["sales","Ventas"],["config","Configuración"]];
const safeName = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w.\- ]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 70) || "archivo";
const bkExt = (type, name) => { const m = String(name || "").match(/\.([a-z0-9]{2,5})$/i); if (m) return m[1].toLowerCase(); return ({"image/png":"png","image/jpeg":"jpg","image/webp":"webp","image/gif":"gif","image/svg+xml":"svg","application/pdf":"pdf","video/mp4":"mp4","text/csv":"csv","application/json":"json","font/woff2":"woff2"})[type] || "bin"; };
const csvCell = v => { const s = v == null ? "" : String(v); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCsv = (rows, cols) => "\uFEFF" + [cols.map(c => c[1]).join(";")].concat(rows.map(r => cols.map(c => csvCell(typeof c[0] === "function" ? c[0](r) : r[c[0]])).join(";"))).join("\r\n");
async function runBackup(withFiles){

    const data = {}, counts = {};

      try { const snap = await S.db.collection(c).limit(10000).get(); data[c] = snap.docs.map(d => Object.assign({id:d.id}, d.data())); }
      catch(e){ data[c] = c === "items" ? S.items : c === "content" ? S.content : c === "ideas" ? S.ideas : c === "library" ? S.library : c === "sales" ? S.sales : c === "metrics" ? S.metrics : []; }

    zip.file("hojas/tareas.csv", toCsv(data.tasks.slice().sort(taskSort), [["due","Fecha"],["title","Tarea"],[r => r.done ? "sí" : "","Hecha"],["notes","Notas"]]));
    zip.file("hojas/ideas.csv", toCsv(data.ideas, [[r => r.createdAt ? ymd(new Date(r.createdAt)) : "","Creada"],[r => ideaTitle(r),"Título"],[r => CH[r.channel]?.name || "General","Canal"],[r => PR[r.product]?.name || "","Producto"],["text","Texto para la publicación"],["fileName","Archivo"]]));
    zip.file("hojas/contenidos.csv", toCsv(data.content, [[r => r.updatedAt ? ymd(new Date(r.updatedAt)) : "","Actualizado"],["kind","Tipo"],["title","Título"],[r => ST[r.status]?.name || r.status,"Estado"],["body","Texto"],["fileName","Archivo"]]));
    let nFiles = 0, bytes = 0, failed = 0;
    if (withFiles){
      // name every file after what uses it, so the folder is readable without the station
      const named = new Map();
      const add = (id, folder, name) => { if (!id || named.has(id)) return; named.set(id, {folder, name}); };
      data.items.forEach(i => { add(i.designAssetId, "calendario", `${i.date || "sin-fecha"} ${i.title}`); (i.variants || []).forEach(v => add(v.assetId, "calendario", `${i.date || "sin-fecha"} ${i.title} - ${v.name}`)); });
      data.ideas.forEach(i => add(i.fileAssetId, "ideas", `${i.createdAt ? ymd(new Date(i.createdAt)) : ""} ${ideaTitle(i)}${i.fileName ? " - " + i.fileName.replace(/\.[^.]+$/, "") : ""}`));
      data.content.forEach(c => { add(c.designAssetId, "contenidos", `${c.title} - diseño`); add(c.fileAssetId, "contenidos", `${c.title}${c.fileName ? " - " + c.fileName.replace(/\.[^.]+$/, "") : ""}`); });
      data.library.forEach(a => add(a.assetId, "portal/" + safeName(a.category || "otros"), (a.copyName || a.name || "archivo").replace(/\.[^.]+$/, "")));

      ``, `Para tenerla también en OneDrive, guarda el .zip dentro de tu carpeta de OneDrive en el ordenador.`].join("\r\n"));

}

const DOCS_RULE = `DOCUMENTACIÓN OFICIAL (OBLIGATORIO): tienes las herramientas search_docs y read_doc, que consultan los artículos del portal de soporte de Inèdit (inedit.freshdesk.com). Antes de escribir o responder sobre cualquier función, menú, ajuste, compatibilidad o dato técnico de un producto, búscalo con search_docs y, si hace falta, lee el artículo con read_doc. Basa la pieza en lo que dice el artículo y enlaza su URL exacta (en el idioma de la pieza si existe). NUNCA afirmes que una función no existe: si no la encuentras, prueba otros términos (sinónimos, en inglés y en español) y, si sigue sin aparecer, di que no la has encontrado en la documentación sincronizada y pregunta.`;
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
async function loadDocs(){
  if (S.docs) return S.docs;
  if (!S.db) return [];
  if (!S._docsP) S._docsP = S.db.collection("docs").limit(1000).get().then(snap => { S.docs = snap.docs.map(d => Object.assign({id:d.id}, d.data())); setFoot(); return S.docs; }).catch(() => { S._docsP = null; return []; });
  return S._docsP;
}
function searchDocs(docs, query, product){
  const words = norm(query).split(/[^a-z0-9]+/).filter(w => w.length > 1 && !["de","la","el","en","y","a","the","of","to","and","in","for","how","como","con","por","que"].includes(w));
  if (!words.length) return [];
  const scored = docs.filter(d => !product || norm(d.product).includes(norm(product))).map(d => {
    const title = norm(d.title), folder = norm(d.folder), text = norm(d.text);
    let score = 0;
    for (const w of words){ if (title.includes(w)) score += 6; if (folder.includes(w)) score += 2; const m = text.split(w).length - 1; score += Math.min(m, 5); }
    if (title.includes(norm(query))) score += 15;
    return {d, score};
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, 6);
  return scored.map(({d}) => {
    const t = String(d.text || ""), i = Math.max(0, norm(t).indexOf(words[0]) - 200);
    return {title:d.title, product:d.product, folder:d.folder, url_en:d.url_en, url_es:d.url_es || "", excerpt:t.slice(i, i + 900)};
  });
}

async function windsorData(input){
  let r = (await S.mcp.callTool(WINDSOR, "get_data", input, {cache:false})).payload;
  const started = Date.now();
  while (r && !Array.isArray(r) && r.status === "pending" && Date.now() - started < 300000){
    await new Promise(res => setTimeout(res, Math.min(60, Math.max(5, r.poll_after_seconds || 10)) * 1000));

  // the rows as {data:[...]} — accept that shape too, but never require a "done" status.
  if (typeof r === "string"){ try { r = JSON.parse(r); } catch(e){} }
  const rows = windsorRows(r);
  if (rows) return rows;
  const msg = r && ((r.error && (r.error.message || r.error)) || r.message || r.detail);
  console.warn("Windsor.ai get_data: unexpected payload", r);
  throw {code: r && r.status === "pending" ? "still_pending" : "bad_payload", message: typeof msg === "string" ? msg.slice(0, 160) : ""};
}

  if (!r || typeof r !== "object" || depth > 2) return null;
  for (const k of ["data", "result", "results", "rows", "items", "records"]){ const v = windsorRows(r[k], depth + 1); if (v) return v; }

    return Object.entries(g).map(([k, a]) => ({k, n:a.length, views:sum(a, "views"), avgViews: sum(a, "views") / a.length, avgPct: wavg(a, "avgPct", "views"), ctr: wavg(a, "ctr", "impressions"), subs: sum(a, "subs")})).sort((a, b) => b.views - a.views); };
  const byType = group(d => d.type || "Vídeo"), byProduct = group(d => PR[d.product]?.name || "Inèdit"), byLang = group(d => (d.lang || "—").toUpperCase());
  const months = {}; vids.forEach(d => { const m = String(d.date).slice(0, 7); const x = months[m] = months[m] || {views:0, n:0}; x.views += d.views || 0; x.n++; });

  const insights = [];
  if (byViews.length >= 3){ const top3 = sum(byViews.slice(0, 3), "views"); if (views && top3 / views > 0.5) insights.push(`Muy concentrado: los 3 vídeos más vistos suman el ${Math.round(top3 / views * 100)} % de todas las visualizaciones.`); }

  if (avgPct != null) insights.push(avgPct < 0.3 ? `Retención baja (${ytPct(avgPct)} visto de media): conviene acortar las introducciones y enseñar el resultado en los primeros 15 segundos.` : avgPct > 0.5 ? `Retención sólida (${ytPct(avgPct)} visto de media): el contenido mantiene la atención; se puede probar con formatos más largos.` : `Retención media del ${ytPct(avgPct)}: hay margen mejorando el gancho inicial.`);

<script>
(() => {
"use strict";

/* ---------- Static config ---------- */
const CHANNELS = [
  {id:"linkedin", name:"LinkedIn", color:"var(--c-linkedin)", desc:"Posts de empresa y de producto en LinkedIn."},
  {id:"meta", name:"Instagram y Facebook", color:"var(--c-meta)", desc:"Piezas cortas y visuales para Meta."},
  {id:"newsletter", name:"Newsletter", color:"var(--c-newsletter)", desc:"Envíos generales a toda la lista de suscriptores."},
  {id:"emailing", name:"Emailing", color:"var(--c-emailing)", desc:"Campañas y emails comerciales a segmentos concretos."},
  {id:"ferias", name:"Ferias", color:"var(--c-ferias)", desc:"Organización de ferias: hitos, stand, demos y comunicación."},
  {id:"webinars", name:"Webinars", color:"var(--c-webinars)", desc:"Planificación y promoción de webinars."},
  {id:"website", name:"Website", color:"var(--c-website)", desc:"Actualizaciones y textos de la web."},
  {id:"youtube", name:"YouTube", color:"var(--c-youtube)", desc:"Vídeos demo de producto."}
];
const CH = Object.fromEntries(CHANNELS.map(c => [c.id, c]));

const GUIDES = {
  linkedin:"Post de LinkedIn: gancho en la primera línea; 600–1.300 caracteres; párrafos de 1–2 líneas; una sola CTA; 3–5 hashtags al final; añade un brief visual corto (imagen o carrusel).",
  instagram:"Post de Instagram: copy de máximo 300 caracteres, tono cercano, 1–2 emojis como máximo, una CTA ('enlace en la bio' si hace falta); propone formato (imagen, carrusel o reel) con brief visual; 5–8 hashtags.",
  facebook:"Post de Facebook: copy de máximo 400 caracteres, tono cercano, una CTA con enlace; brief visual.",
  newsletter:"Newsletter general (toda la lista: clientes y no clientes): asunto (máx. 60 caracteres), texto de vista previa, cuerpo de 150–200 palabras en párrafos de máximo 3 líneas, una sola CTA, firma 'The Inèdit team' / 'El equipo de Inèdit' y, al pie, enlace discreto a la documentación.",
  emailing:"Email de campaña o comercial a un segmento: 3 opciones de asunto (máx. 50 caracteres), texto de vista previa, saludo con [Nombre], cuerpo de unas 150 palabras centrado en un problema del segmento, una sola CTA (prueba o demo), firma; al final propone un email de seguimiento corto.",
  website:"Copy web: title SEO (máx. 60 caracteres), meta description (máx. 155), H1, secciones con H2, una CTA; enlaza al artículo exacto de la documentación cuando menciones una función.",
  youtube:"Vídeo demo de 2–4 minutos: título (máx. 70 caracteres), guion por escenas con tiempos y texto en pantalla, descripción con capítulos y enlaces a la documentación exacta, brief de miniatura.",
  ferias:"Feria: plan con hitos relativos (8, 4 y 2 semanas antes, durante, después), mensajes del stand, guion de demo, posts de antes/durante/después, email de invitación y checklist logístico. No inventes fechas, número de stand ni ponentes.",
  webinars:"Webinar: título, resumen de máximo 80 palabras, agenda, ponentes ([NEEDS INFO] si no se dan), email de invitación y recordatorio, 2 posts de promoción y 5 preguntas para el Q&A.",
  plan:"Plan de campaña: objetivo ligado a un KPI, audiencias, máximo 3 mensajes clave, tabla de calendario (fecha o momento relativo · canal · pieza), dependencias y riesgos. No inventes fechas."
};

const TYPES = [
  {id:"social", name:"Post en redes", desc:"LinkedIn, Instagram o Facebook", agent:"Redactor de redes sociales",
   sub:{label:"Red", def:"linkedin", opts:[["linkedin","LinkedIn"],["instagram","Instagram"],["facebook","Facebook"]]}},
  {id:"newsletter", name:"Newsletter", desc:"Envío general a toda la lista", agent:"Editor de newsletter"},
  {id:"emailing", name:"Emailing", desc:"Campaña o email a un segmento", agent:"Redactor de emailing"},
  {id:"release", name:"Notas de versión", desc:"HTML para WordPress, EN y ES", agent:"Redactor de notas de versión", link:"releases"},
  {id:"web", name:"Web", desc:"Páginas y textos del sitio", agent:"Redactor web"},
  {id:"video", name:"Vídeo demo", desc:"Guion y descripción para YouTube", agent:"Guionista de vídeo"},
  {id:"event", name:"Feria o webinar", desc:"Plan, mensajes y comunicación", agent:"Estratega de eventos",
   sub:{label:"Tipo", def:"ferias", opts:[["ferias","Feria"],["webinars","Webinar"]]}},
  {id:"plan", name:"Plan de campaña", desc:"Calendario y mensajes clave", agent:"Estratega"},
  {id:"fairkit", name:"Kit de feria", desc:"Plan, ficha, posts, email, one-pager y demo", agent:"Estratega de eventos", link:"fair"},
  {id:"pack", name:"Pack de lanzamiento", desc:"Una fuente → todas las piezas", agent:"Estratega de contenidos", link:"pack"},
  {id:"company", name:"Textos de empresa", desc:"Fichas, directorios y perfiles con límite", agent:"Redactor corporativo", link:"company"}
];
const TY = Object.fromEntries(TYPES.map(t => [t.id, t]));
function typeChannel(f){
  if (f.type === "social") return f.sub === "linkedin" ? "linkedin" : "meta";
  return {newsletter:"newsletter", emailing:"emailing", web:"website", video:"youtube", event:f.sub || "ferias", plan:null}[f.type] || null;
}
function typeGuide(f){
  if (f.type === "social") return GUIDES[f.sub || "linkedin"];
  return GUIDES[{newsletter:"newsletter", emailing:"emailing", web:"website", video:"youtube", event:f.sub || "ferias", plan:"plan"}[f.type]];
}
function typeLabel(f){ const t = TY[f.type]; const so = t.sub ? t.sub.opts.find(o => o[0] === f.sub) : null; return t.name + (so ? " · " + so[1] : ""); }

const PRODS = [
  {id:"inedit", name:"Inèdit", short:"In", color:"#FE5000", focus:"Pieza corporativa: habla de Inèdit como empresa (servicios, equipo, ferias, alianzas). Colores corporativos: naranja #FE5000 y gris #888B8D."},
  {id:"neostampa", name:"neoStampa", short:"nS", color:"#0072CE", focus:"Producto: neoStampa (RIP de impresión textil). Color de producto #0072CE."},
  {id:"neotextil", name:"neoTextil", short:"nT", color:"#DA291C", focus:"Producto: neoTextil (plugins de diseño textil para Photoshop). Puede ser algo más creativo y visual. Color de producto #DA291C."},
  {id:"neocatalog", name:"neoCatalog", short:"nC", color:"#509E2F", focus:"Producto: neoCatalog (catálogo y colecciones, colaboración, versiones). Color de producto #509E2F."},
  {id:"neomatch", name:"neoMatch", short:"nM", color:"#5F6468", focus:"Producto: neoMatch (calibración de librerías de color, Delta Checker). Su color de producto no está documentado: usa los corporativos."}
];
const PR = Object.fromEntries(PRODS.map(p => [p.id, p]));

const AUDS = [
  {id:"all", name:"Todos", desc:"Audiencia mixta: clientes y no clientes. Traduce mejoras en beneficios; el cierre sirve a ambos."},
  {id:"customers", name:"Clientes actuales", desc:"Clientes actuales: retención y actualización. Mensaje: su inversión sigue rindiendo, con pruebas. Tono de socio."},
  {id:"dtgdtf", name:"Decoradores DTG/DTF", desc:"Decoradores de prendas DTG/DTF (captación): problemas prácticos como tinta blanca, deriva de color y prendas reales; lenguaje práctico, nada industrial."},
  {id:"industrial", name:"Sublimación y directo a tejido", desc:"Producción industrial por sublimación y roll-to-roll directo a tejido, incluidas alfombras: lotes, sustratos, perfiles, ΔE, coste por metro, repetibilidad tras vaporizado y lavado."},
  {id:"partners", name:"Distribuidores y fabricantes", desc:"Distribuidores y fabricantes de impresoras: neoStampa como la capa de color que hace lucir su hardware; tono de socio profesional; nunca ataques RIPs de terceros."},
  {id:"designers", name:"Diseñadores textiles", desc:"Diseñadores textiles y estudios: flujo de diseño a producción, creatividad y rapidez."},
  {id:"catalog", name:"Equipos de catálogo", desc:"Equipos de producto, ventas y merchandising: colaboración entre equipos y control de versiones."}
];
const AU = Object.fromEntries(AUDS.map(a => [a.id, a]));
const ICON_RX = {neostampa:/(^|[^a-z])ns([^a-z]|$)|neostampa/i, neotextil:/(^|[^a-z])nt([^a-z]|$)|neotextil/i, neocatalog:/(^|[^a-z])nc([^a-z]|$)|neocatalog/i, neomatch:/(^|[^a-z])nm([^a-z]|$)|neomatch/i};
const assetNames = a => [a.name, a.copyName].filter(Boolean).map(n => String(n).replace(/\.[a-z0-9]+$/i, ""));
function productOfAsset(a){
  if (!a || /fiery|inedit|in[eè]dit/i.test(assetNames(a).join(" ")) && !Object.values(ICON_RX).some(rx => assetNames(a).some(n => rx.test(n)))) return "";
  const hits = Object.entries(ICON_RX).filter(([, rx]) => assetNames(a).some(n => rx.test(n))).map(([pid]) => pid);
  return hits.length === 1 ? hits[0] : "";
}
const isIconFile = a => !!productOfAsset(a);
function iconAsset(pid){
  if (!ICON_RX[pid]) return null;
  const marks = S.library.filter(a => a.category === "logos" && a.assetId && /^image\//.test(a.contentType || "") && productOfAsset(a) === pid);
  return marks.find(a => /icon|icono/i.test(assetNames(a).join(" "))) || marks[0] || null;
}
function picon(p, size){
  const a = iconAsset(p.id);
  if (a) return h("img",{class:"picon", src:"/_blob/" + a.assetId, alt:p.name, style:{width:size||"20px", height:size||"20px", objectFit:"contain", background:"transparent", borderRadius:"0"}});
  return h("span",{class:"picon", style:{background:p.color, width:size||null, height:size||null}}, p.short);
}

const STATUSES = [
  {id:"idea", name:"Idea", color:"#A3A8AC"},
  {id:"borrador", name:"Borrador", color:"#E0A100"},
  {id:"revision", name:"En revisión", color:"#7A4FD1"},
  {id:"aprobado", name:"Aprobado", color:"#0072CE"},
  {id:"publicado", name:"Publicado", color:"#509E2F"}
];
const ST = Object.fromEntries(STATUSES.map(s => [s.id, s]));
const AGENT_NAMES = Object.fromEntries(TYPES.map(t => [t.id, t.agent]));

const LIB = [
  {id:"brochures", name:"Brochures"},
  {id:"flyers", name:"Flyers"},
  {id:"precios", name:"Listas de precios"},
  {id:"logos", name:"Logos"},
  {id:"disenos", name:"Diseños"},
  {id:"otros", name:"Otros"},
  {id:"ideas", name:"Ideas"}
];

const KB = `CONOCIMIENTO DE INÈDIT (única fuente de verdad; no inventes nada fuera de esto):
EMPRESA: Inèdit Software, Sant Vicenç de Montalt (Barcelona), más de 25 años. Forma parte de Fiery, LLC desde el 8 de enero de 2026 y mantiene su propia marca. Epson compró Fiery en diciembre de 2024: menciona Epson solo en piezas corporativas o de canal. EFI no es la matriz (es socio OEM). Fiery Digital Factory es un producto hermano: nunca lo ataques. Servicios: consultoría, formación y software OEM.
PRODUCTOS:
- neoStampa (prioritario): RIP para impresión textil digital. Gestión de color, calibración, perfiles ICC, control de costes y de tinta, edición de imagen, Print Server, Hot Folders. Base de datos de 1.452 modelos de impresora (Epson 183, Mimaki 154, HP 128, Roland 94). v26.9 (septiembre 2026): soporte para el ink set CMYKRGBHF (beneficio no documentado: no lo inventes), la tinta blanca DTF sigue exactamente los ajustes de canal, Hot Folders más limpias, Print Server con puerto estable, ventana de medición DRD en el orden de la carta impresa. El Calibration Wizard admite X-Rite i1 Pro 3 y cartas Barbieri SpectroSwing (desde v26.3).
- neoMatch: calibración de librerías de color (valores Lab con X-Rite i1 Pro o librerías importadas como Pantone); propone referencias corregidas dentro de los perfiles de neoStampa; avisa de colores imposibles de reproducir. Delta Checker valida calibraciones entre sustratos y controla lavado o vaporizado. Prueba gratuita de 30 días.
- neoTextil: plugins de diseño textil para Adobe Photoshop (2025); Quick Rapport (repetición de patrones asistida por IA).
- neoCatalog: gestión de catálogo y colecciones; colaboración entre equipos; control de activos y versiones.
MERCADOS: DTF, DTG, sublimación y roll-to-roll directo a tejido (incluidas alfombras). Idiomas externos: solo español e inglés. Newsletter en inglés.
VOZ: segura y sin exageraciones (prohibido: amazing, incredible, revolutionary, increíble, revolucionario, el mejor); concreta (datos, procesos, ejemplos reales); colaborativa ("trabajamos contigo"). Nunca inventes cifras, citas ni clientes: escribe [NEEDS REAL DATA: …]. Traduce mejoras en beneficios; no enumeres bugs corregidos. Los cierres sirven a clientes y no clientes. Una sola CTA.
KPIs: altas de prueba de neoStampa; demos cualificadas; tasa de actualización de clientes; acuerdos de co-marketing con distribuidores; CTR de newsletter a prueba.
CASOS (usa solo esto): Cotton Print Chile (Santiago, agosto 2025; DTG con Kornit y telas sublimadas por rollo; imprime solo con neoStampa; 30 % menos de tinta sin perder intensidad; di "colores consistentes", nunca "idénticos"). Transfertex · myTFX (papel transfer de sublimación; neoStampa imprime solo los metros comprados, pago por metro; alianza de más de 25 años; fecha sin confirmar: no lo presentes como novedad). S3RTEC Printer & Inks (España; socio que calibró una Hanrun DTF con neoStampa Delta v26.1 y lo publicó por iniciativa propia). Optimum Digital USA (Atlanta; fabricante de impresoras para alfombra y textil; forma a sus clientes en neoStampa, perfiles y color matching con Pantone).
FERIAS: FESPA Barcelona 2026 (Hall 3, stand D50, con DTF Station y Epson Ibérica); PRINTING United 2026 (booth 1449; primera como parte de Fiery: coordina el mensaje con Fiery); ITMA; ITMA Asia + CITME 2026.
COLORES: corporativo naranja #FE5000 y gris #888B8D; neoStampa azul #0072CE; neoTextil rojo #DA291C; neoCatalog verde #509E2F.
RECURSOS: documentación de todos los productos https://inedit.freshdesk.com/en/support/solutions (español: /es/). Notas de versión neoStampa v26: https://inedit.freshdesk.com/en/support/solutions/articles/14000162742.`;

function kbText(){
  const k = S.knowledge;
  if (!k || typeof k.kb !== "string" || k.kb.trim().length < 200) return KB;
  const rules = Array.isArray(k.rules) && k.rules.length ? "\nREGLAS DEL DECISION-LOG (obligatorias):\n" + k.rules.map(r => "- " + r).join("\n") : "";
  return "CONOCIMIENTO DE INÈDIT (sincronizado desde el repositorio inedit-os-pack; es la única fuente de verdad, no inventes nada fuera de esto):\n" + k.kb.trim() + rules;
}
const CLOSING_T = () => `FORMATO DE ENTREGA: primero la pieza lista para usar. Después, un bloque final breve con: "Supuestos:", "Preguntas abiertas:" y "Siguiente paso:". Escribe la pieza en el idioma pedido; el bloque final, en ${uiLangName()}. Sin markdown pesado: usa texto plano con saltos de línea.`;

const REVIEW_T = () => `Eres el Revisor de marca de Inèdit. Revisa la pieza con este checklist y responde en ${uiLangName()}:
1 Tono seguro, concreto, colaborativo, sin hype. 2 Cada afirmación técnica está en el conocimiento de Inèdit. 3 Sin cifras, citas ni clientes inventados. 4 Producto correcto para la audiencia. 5 Hechos corporativos correctos (Fiery, EFI, Epson). 6 Cifras volátiles verificadas o marcadas. 7 Una sola CTA ligada a un KPI. 8 Muestra colaboración y resultado de color, no solo funciones. 9 Longitud y formato adecuados al canal. 10 Colores y logo correctos si hay brief visual. 11 Audiencia mixta: no enumera bugs, traduce a beneficios. 12 Beneficios solo si constan en el conocimiento; si no, [NEEDS REAL DATA]. 13 El cierre sirve a clientes y no clientes. 14 No quedan marcadores [NEEDS …] si la pieza se va a publicar.
Formato: "Veredicto: PASS" o "Veredicto: FAIL"; luego los puntos que fallan con el motivo; luego cambios propuestos (antes → después, máximo 8); y si es FAIL, la versión corregida completa al final bajo "Versión corregida:".`;

/* ---------- State ---------- */
const S = {
  view: "home", libTab: "brochures", dash: null, dashEdit: false, tlQuery: "", userId: null,

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()){
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}

const DOCS_RULE = `DOCUMENTACIÓN OFICIAL (OBLIGATORIO): tienes las herramientas search_docs y read_doc, que consultan los artículos del portal de soporte de Inèdit (inedit.freshdesk.com). Antes de escribir o responder sobre cualquier función, menú, ajuste, compatibilidad o dato técnico de un producto, búscalo con search_docs y, si hace falta, lee el artículo con read_doc. Basa la pieza en lo que dice el artículo y enlaza su URL exacta (en el idioma de la pieza si existe). NUNCA afirmes que una función no existe: si no la encuentras, prueba otros términos (sinónimos, en inglés y en español) y, si sigue sin aparecer, di que no la has encontrado en la documentación sincronizada y pregunta.`;
const norm = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
async function loadDocs(){
  if (S.docs) return S.docs;
  if (!S.db) return [];
  if (!S._docsP) S._docsP = S.db.collection("docs").limit(1000).get().then(snap => { S.docs = snap.docs.map(d => Object.assign({id:d.id}, d.data())); setFoot(); return S.docs; }).catch(() => { S._docsP = null; return []; });
  return S._docsP;
}
function searchDocs(docs, query, product){
  const words = norm(query).split(/[^a-z0-9]+/).filter(w => w.length > 1 && !["de","la","el","en","y","a","the","of","to","and","in","for","how","como","con","por","que"].includes(w));
  if (!words.length) return [];
  const scored = docs.filter(d => !product || norm(d.product).includes(norm(product))).map(d => {
    const title = norm(d.title), folder = norm(d.folder), text = norm(d.text);
    let score = 0;
    for (const w of words){ if (title.includes(w)) score += 6; if (folder.includes(w)) score += 2; const m = text.split(w).length - 1; score += Math.min(m, 5); }
    if (title.includes(norm(query))) score += 15;
    return {d, score};
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, 6);
  return scored.map(({d}) => {
    const t = String(d.text || ""), i = Math.max(0, norm(t).indexOf(words[0]) - 200);
    return {title:d.title, product:d.product, folder:d.folder, url_en:d.url_en, url_es:d.url_es || "", excerpt:t.slice(i, i + 900)};
  });
}
const DOC_TOOLS = [
  {name:"search_docs", description:"Busca en los artículos oficiales del soporte de Inèdit (Freshdesk) por palabras clave, en inglés o en español. Devuelve hasta 6 artículos con título, producto, carpeta, URL y un extracto. Úsala antes de escribir sobre cualquier función o dato técnico.",
   inputSchema:{type:"object", properties:{query:{type:"string", description:"Palabras clave, p. ej. 'color knockout' o 'choke DTF'"}, product:{type:"string", description:"Opcional: neoStampa, neoTextil, neoCatalog, neoMatch o FAQs"}}, required:["query"]},
   execute: async (input) => {
     const docs = await loadDocs();
     if (!docs.length) throw new Error("La documentación todavía no está sincronizada en la estación (hay que ejecutar /sync en Claude Code). No afirmes que una función no existe: indica que no puedes verificarla ahora.");
     const r = searchDocs(docs, String(input.query || ""), input.product ? String(input.product) : "");
     return r.length ? r : "Sin resultados para esa búsqueda. Prueba con sinónimos o en el otro idioma.";
   }},
  {name:"read_doc", description:"Devuelve el texto completo de un artículo de la documentación a partir de su URL (la que devuelve search_docs).",
   inputSchema:{type:"object", properties:{url:{type:"string"}}, required:["url"]},
   execute: async (input) => {
     const docs = await loadDocs(); const u = String(input.url || "");
     const d = docs.find(x => x.url_en === u || x.url_es === u || (u && (u.includes(x.id) || (x.url_en && u.startsWith(x.url_en.split("-")[0])))));
     if (!d) throw new Error("No encuentro ese artículo en la documentación sincronizada.");
     return {title:d.title, product:d.product, folder:d.folder, url_en:d.url_en, url_es:d.url_es || "", text:String(d.text || "").slice(0, 14000)};
   }}
];

  items.forEach(i => {

    const desc = `${ST[i.status]?.name || ""}${PR[i.product] ? " · " + PR[i.product].name : ""}\n\n${String(i.body || "").replace(ASK_RX,"").slice(0, 600)}\n\nAbrir la Command Station: ${STATION_URL}`;
    lines.push("BEGIN:VEVENT", `UID:${i.id}@inedit-command-station`, `DTSTAMP:${stamp}`, `DTSTART:${d}T${hh}0000`, `DTEND:${d}T${hh}3000`, icsFold("SUMMARY:" + icsEsc(summary)), icsFold("DESCRIPTION:" + icsEsc(desc)), `URL:${STATION_URL}`,

/* ---------- Results (Windsor.ai) + Analyst ---------- */
const WINDSOR = "Windsor.ai";
const IG_FIELDS = ["media_id","timestamp","media_type","media_caption","media_permalink","media_reach","media_views","media_engagement","media_saved","media_shares","media_profile_visits"];
async function windsorData(input){
  let r = (await S.mcp.callTool(WINDSOR, "get_data", input, {cache:false})).payload;
  const started = Date.now();
  while (r && !Array.isArray(r) && r.status === "pending" && Date.now() - started < 300000){
    await new Promise(res => setTimeout(res, Math.min(60, Math.max(5, r.poll_after_seconds || 10)) * 1000));
    r = (await S.mcp.callTool(WINDSOR, "get_data", input, {cache:false})).payload;
  }
  // Windsor.ai get_data returns the rows as a plain array on success; only a long-running
  // pull returns {status:"pending", poll_after_seconds}. Some connectors may still wrap
  // the rows as {data:[...]} — accept that shape too, but never require a "done" status.
  if (Array.isArray(r)) return r;
  if (r && Array.isArray(r.data)) return r.data;
  throw {code: r && r.status === "pending" ? "still_pending" : "bad_payload"};
}
function guessProduct(t){ const x = norm(t); return /neostampa/.test(x) ? "neostampa" : /neotextil/.test(x) ? "neotextil" : /neocatalog/.test(x) ? "neocatalog" : /neomatch/.test(x) ? "neomatch" : "inedit"; }
function guessLang(t){ const x = " " + norm(t) + " "; const es = (x.match(/ (el|la|los|las|para|con|nuestro|nuestra|que|una) /g)||[]).length, pt = (x.match(/ (nos|estande|voce|nossa|conheca|ao|vivo|tudo|isso) /g)||[]).length, en = (x.match(/ (the|and|your|our|with|you|every|to) /g)||[]).length; return pt > es && pt > en ? "pt" : es > en ? "es" : "en"; }
const median = arr => { const a = arr.filter(n => n != null && !isNaN(n)).sort((x,y) => x-y); if (!a.length) return 0; const m = Math.floor(a.length/2); return a.length % 2 ? a[m] : (a[m-1]+a[m])/2; };

function metricsSummary(){
  const all = S.metrics.slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
  if (!all.length) return "";
  const wd = ["dom","lun","mar","mié","jue","vie","sáb"];
  return Object.keys(PLATFORMS).filter(pl => all.some(d => platOf(d) === pl)).map(pl => {
    const m = all.filter(d => platOf(d) === pl);
    const byType = {}; m.forEach(d => { (byType[d.type || "—"] = byType[d.type || "—"] || []).push(d); });
    return `MÉTRICAS DE ${PLATFORMS[pl].name.toUpperCase()} (${m.length} publicaciones; "alcance" = ${pl === "linkedin" ? "impresiones" : "alcance"}):\n` +
      Object.entries(byType).map(([t, arr]) => `- ${t}: ${arr.length} posts, alcance medio ${Math.round(arr.reduce((s,d)=>s+(d.reach||0),0)/arr.length)}, ER medio ${(arr.reduce((s,d)=>s+(d.er||0),0)/arr.length*100).toFixed(1)} %`).join("\n") +
      "\nDETALLE (fecha · día · hora · tipo · alcance · engagement · clics · guardados · compartidos · texto):\n" +
      m.slice(0, 40).map(d => `${d.date} · ${wd[new Date(d.date + "T12:00:00").getDay()]} · ${d.time || "—"} · ${d.type || "—"} · ${Math.round(d.reach||0)} · ${Math.round(d.engagement||0)} · ${d.clicks != null ? Math.round(d.clicks) : "—"} · ${d.saved != null ? Math.round(d.saved) : "—"} · ${Math.round(d.shares||0)} · ${String(d.caption||"").replace(/\s+/g," ").slice(0, 220)}`).join("\n");
  }).join("\n\n");
}
async function promoteBest(){
  if (!S.db) return 0;
  let n = 0;
  for (const pl of Object.keys(PLATFORMS)){
    const docs = S.metrics.filter(d => platOf(d) === pl);
    if (docs.length < 4) continue;
    const mr = median(docs.map(d => d.reach || 0)), me = median(docs.map(d => d.er || 0));
    const best = docs.filter(d => (d.lang === "en" || d.lang === "es") && nchars(d.caption) > 60 && (d.reach || 0) >= mr && (d.er || 0) >= me * 1.2).sort((a,b) => (b.er||0) - (a.er||0)).slice(0, 3);
    for (const d of best){
      const id = pl.slice(0,2) + "-" + String(d.media_id).replace(/[^\w-]/g, "").slice(0, 60);
      if (S.models.some(m => m.id === id)) continue;
      await S.db.collection("models").doc(id).set({channel:PLATFORMS[pl].channel, product:d.product || guessProduct(d.caption), audience:"all", lang:d.lang || guessLang(d.caption), title:`${PLATFORMS[pl].name} ${d.date} · alcance ${Math.round(d.reach||0)} · ER ${((d.er||0)*100).toFixed(1)} %`, body:d.caption, source:"datos", createdAt: Date.now()});
      n++;
    }
  }
  return n;
}

${kbText()}

${metricsSummary()}

function salesTargetPanel(){

  const yr = years.includes(S.salesYear) ? S.salesYear : String(cy);
  const targets = (S.salesTargets && S.salesTargets.targets) || {};

  const ownerTargets = (S.salesTargets && S.salesTargets.byOwner && S.salesTargets.byOwner[yr]) || {};
  const target = rep ? (+ownerTargets[repId] || 0) : (+targets[yr] || 0);
  const isCur = +yr === cy, isPast = +yr < cy;
  const frac = isPast ? 1 : isCur ? (now - new Date(cy,0,1)) / (new Date(cy+1,0,1) - new Date(cy,0,1)) : 0;
  const cur = wonMonths(yr, repId), prev = wonMonths(+yr - 1, repId);
  const cc = cumul(cur), cp = cumul(prev);
  const billed = cc[11];
  const md = isCur ? ymd(now).slice(5) : "12-31";
  const upTo = y => S.sales.filter(d => d.stageGroup === "ganada" && yearOf(d) === String(y) && String(d.date).slice(5,10) <= md && ownerMatch(d, repId)).reduce((s,d) => s + (d.amount||0), 0);
  const prevToDate = upTo(+yr - 1), curToDate = upTo(yr);
  const pipe = S.sales.filter(d => d.stageGroup === "abierta" && yearOf(d) === String(yr) && ownerMatch(d, repId)).reduce((s,d) => s + (d.amount||0), 0);
  const pct = target ? billed / target * 100 : 0;
  const pace = target * frac, gap = billed - pace;

  const box = h("div",{class:"list"});
  // Header: year + target editor
  const inp = h("input",{type:"number", min:"0", step:"1000", value: target || "", placeholder:"Ej.: 1500000", style:{width:"150px"}});
  const save = async () => {
    const v = Math.max(0, Math.round(+inp.value || 0));
    const base = S.salesTargets || {};
    S.salesTargets = rep
      ? Object.assign({}, base, {byOwner: Object.assign({}, base.byOwner || {}, {[yr]: Object.assign({}, ownerTargets, {[repId]: v})})})
      : Object.assign({}, base, {targets: Object.assign({}, targets, {[yr]: v})});

const COUNTRY_TO_GROUP = new Map(COUNTRY_GROUPS.flatMap(g => g.members.map(m => [norm(m), g.name])));
const countryGroupOf = c => COUNTRY_TO_GROUP.get(norm(c||"")) || "Otros";
const STAGE_GROUPS = [
  {id:"", name:"Todas"},
  {id:"ganada", name:"Ganadas", color:"#509E2F"},
  {id:"abierta", name:"Pipeline abierto", color:"#E0A100"},
  {id:"perdida", name:"Perdidas", color:"#C42A1A"}
];
const SG = Object.fromEntries(STAGE_GROUPS.filter(g=>g.id).map(g => [g.id, g]));
function csvSplitLine(line, delim){
  const out = []; let cur = ""; let inQ = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (inQ){ if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else inQ = false; } else cur += c; }
    else { if (c === '"') inQ = true; else if (c === delim){ out.push(cur); cur = ""; } else cur += c; }
  }
  out.push(cur);
  return out;
}
function sanitizeSalesId(s){ s = String(s||"").replace(/[^A-Za-z0-9_-]+/g, "-").replace(/^-+|-+$/g, ""); return s ? s.slice(0,150) : "sin-id"; }
function parseAmountJs(raw){
  let s = String(raw||"").trim();
  if (!s) return null;
  s = s.replace(/[^\d,.\-]/g, "");
  if (!s) return null;
  if (s.includes(",") && s.includes(".")){
    if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (s.includes(",")){
    if (/,\d{1,2}$/.test(s)) s = s.replace(",", ".");
    else s = s.replace(/,/g, "");
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function parseDateJs(raw){
  const s = String(raw||"").trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return s;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m){
    const a = +m[1], b = +m[2], y = m[3];
    const [day, month] = a > 12 ? [a,b] : b > 12 ? [b,a] : [a,b];
    return `${y}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  }
  return null;
}
const quarterOfJs = dIso => { const [y,m] = dIso.split("-"); return `${y}-Q${Math.ceil(+m/3)}`; };
function stageGroupJs(stage){
  const s = norm(stage||"");
  if (s.includes("won") || s.includes("ganad")) return "ganada";
  if (s.includes("lost") || s.includes("perdid")) return "perdida";
  return "abierta";
}
function parseVentasCSV(text){
  text = String(text||"").replace(/^﻿/, "");
  const lines = text.split(/\r\n|\n|\r/).filter(l => l.length);
  if (!lines.length) return {error:"archivo vacío"};
  const delim = (lines[0].split(";").length >= lines[0].split(",").length) ? ";" : ",";
  const headers = csvSplitLine(lines[0], delim).map(h => h.trim());
  const nh = headers.map(norm);
  const findCol = (...needles) => { for (let i = 0; i < nh.length; i++){ if (needles.some(n => nh[i].includes(n))) return i; } return -1; };
  const cols = {
    amount: findCol("amount","importe","monto"), close_date: findCol("close date","fecha de cierre","fecha cierre"), stage: findCol("stage","fase","etapa"),
    name: findCol("opportunity name","nombre de la oportunidad","nombre"), account: findCol("account name","account","cuenta"), owner: findCol("owner","propietario"),
    country: findCol("country","pais"), id: findCol("opportunity id","id de la oportunidad","id")
  };
  if (cols.amount < 0 || cols.close_date < 0 || cols.stage < 0) return {error:"faltan columnas de importe, fecha de cierre o fase", headers};
  const deals = []; let skippedBadRow = 0; const byGroup = {};
  for (const line of lines.slice(1)){
    const row = csvSplitLine(line, delim);
    if (!row.some(v => v && v.trim())) continue;
    const get = i => i >= 0 ? (row[i] || "").trim() : "";
    const d = parseDateJs(get(cols.close_date)), amount = parseAmountJs(get(cols.amount));
    if (!d || amount == null){ skippedBadRow++; continue; }
    const stage = get(cols.stage) || null, name = get(cols.name) || null, account = get(cols.account) || null, owner = get(cols.owner) || null, country = get(cols.country) || null, sfId = get(cols.id) || null;
    const sg = stageGroupJs(stage);
    byGroup[sg] = (byGroup[sg]||0) + 1;
    deals.push({doc_id: "sf-" + sanitizeSalesId(sfId || `${account}-${name}-${d}-${amount}`),
      data: {opportunity:name, account, owner, country, date:d, quarter:quarterOfJs(d), amount:Math.round(amount*100)/100, stage, stageGroup:sg, importedAt: Date.now()}});
  }
  return {deal_records: deals, by_stage_group: byGroup, skipped_bad_row: skippedBadRow, total_rows: lines.length - 1};
}
async function handleSalesCsv(e){
  const file = e.target.files[0]; e.target.value = "";
  if (!file || !S.db) return;
  S.salesImportBusy = true; render();
  try {
    const text = await file.text();
    const res = parseVentasCSV(text);
    if (res.error){ toast(`No se han reconocido las columnas del CSV (${res.error}).`); return; }
    if (!res.deal_records.length){ toast("El archivo no tiene filas válidas (importe o fecha ausentes)."); return; }
    const batchAt = Date.now(), existing = new Map(S.sales.map(d => [salesKey(d), d.id]));
    res.deal_records.forEach(d => { d.data.importedAt = batchAt; const ex = existing.get(salesKey(d.data)); if (ex && !/^sf-[a-zA-Z0-9]{15,18}$/.test(d.doc_id)) d.doc_id = ex; });
    for (let i = 0; i < res.deal_records.length; i += 40){
      await Promise.all(res.deal_records.slice(i, i+40).map(d => S.db.collection("sales").doc(d.doc_id).set(d.data)));
    }
    const g = res.by_stage_group;
    toast(`Importadas ${res.deal_records.length} operaciones (${g.ganada||0} ganadas · ${g.abierta||0} en curso · ${g.perdida||0} perdidas)${res.skipped_bad_row ? ` · ${res.skipped_bad_row} filas descartadas` : ""}`);
  } catch(err){ toast("No se ha podido leer o importar el archivo."); }
  finally { S.salesImportBusy = false; render(); }
}
/* Una oportunidad = misma cuenta + nombre + fecha de cierre + importe. Si aparece en varias importaciones, se queda solo la de la importación más reciente (filas idénticas dentro de una misma importación se respetan). */
const salesKey = d => [norm(d.account||""), norm(d.opportunity||""), d.date||"", Math.round((d.amount||0)*100)].join("|");
function dedupSales(rows){
  const groups = new Map();
  rows.forEach(d => { const k = salesKey(d); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(d); });
  const out = [];
  groups.forEach(g => {
    if (g.length === 1){ out.push(g[0]); return; }
    const newest = Math.max(...g.map(d => d.importedAt || 0));
    out.push(...g.filter(d => newest - (d.importedAt || 0) < 60000));
  });
  return out.sort((a,b) => String(a.date).localeCompare(String(b.date)));
}
function salesFiltered(){
  return S.sales.filter(d => (!S.salesOwner || d.owner === S.salesOwner) && (!S.salesCountry || d.country === S.salesCountry) && (!S.salesQuarter || d.quarter === S.salesQuarter) && (!S.salesStage || d.stageGroup === S.salesStage));
}

function packBlank(){ return {source:"release", releaseId:"", docQuery:"", docPick:null, docResults:[], text:"", product:"neostampa", audience:"all", lang:"en", start:todayStr(), selected:{li:true, ig:true, em:true, nl:true, yt:true, web:false}, core:null, pieces:{}, busy:false}; }
function packSourceText(pk){
  if (pk.source === "release"){
    const r = S.releases.find(x => x.id === pk.releaseId); if (!r) return "";
    const d = r.data || {};
    return `Notas de versión de ${PRODUCTS[r.product]?.name || r.product} ${r.version} (${r.date || "sin fecha"}).\n${d.intro_en || ""}\n` + (d.sections||[]).map(sx => (sx.kind === "new" ? "Novedad" : "Mejora") + (sx.module ? " · " + sx.module : "") + ":\n" + (sx.items||[]).map(i => "- " + (i.en || i.es)).join("\n")).join("\n");

  return pk.text.trim();
}
async function packGenerate(pk, defs, src){
  pk = pk || S.pack; defs = defs || PACK_PIECES; if (!S.sample || pk.busy) return;
  src = src || packSourceText(pk);
  if (nchars(src) < 30) { toast("Elige o escribe la fuente del pack"); return; }
  const chosen = defs.filter(x => pk.selected[x.id]);
  if (!chosen.length) { toast("Elige al menos una pieza"); return; }
  pk.busy = true; pk.core = null; pk.pieces = {}; chosen.forEach(x => pk.pieces[x.id] = {status:"waiting", text:"", date: pieceDate(pk, x)}); render();
  try {
    pk.core = await S.sample.json(`Eres el estratega de contenidos de Inèdit Software. A partir de la FUENTE, define el mensaje común de un pack de contenidos para ${PR[pk.product].name}, audiencia: ${AU[pk.audience].name}.
${kbText()}
Devuelve SOLO un JSON: {"headline":"titular interno de máx. 10 palabras","core_message":"mensaje central en 1-2 frases","key_points":["3 a 5 puntos, solo hechos de la fuente"],"cta":"llamada a la acción común","cta_url":"URL de la fuente si existe, o vacío"}. No inventes nada que no esté en la fuente o en el conocimiento.
FUENTE:
${src}`, {cache:false, modelTier:"default"});
    if (!pk.core || !pk.core.core_message) throw {code:"bad_core"};
  } catch(e){ pk.busy = false; toast("No se ha podido preparar el mensaje común. Vuelve a intentarlo."); render(); return; }
  render();
  const queue = chosen.slice();
  const worker = async () => { while (queue.length){ const x = queue.shift(); await packPiece(x, src, pk); } };
  await Promise.all([worker(), worker()]);
  pk.busy = false; render();
  toast("Pack listo. Revisa cada pieza y prográmalo en el calendario.");
}
function packF(x, pk){ pk = pk || S.pack; return Object.assign({}, x.f, {product:pk.product, audience: x.audience || pk.audience, lang: x.lang || pk.lang}); }

FUENTE:
${src.slice(0, 6000)}`;

}

function sfPrompt(post, ctx){
  const lang = post.lang === "es" ? "es" : "en";
  return `Convierte este ${ctx.type === "newsletter" ? "newsletter" : "email"} de Inèdit Software en los campos de la plantilla HTML de Salesforce (Pardot) de la casa. No cambies el mensaje ni añadas afirmaciones nuevas: reparte el texto existente en los campos, ajustando la longitud. Idioma de los textos: ${lang === "es" ? "español" : "inglés"}.
Devuelve SOLO un JSON con esta forma:
{"subject":"asunto (máx. 60 caracteres)","preheader":"texto de vista previa (máx. 110)","banner_kicker":"línea pequeña sobre el banner, p. ej. 'neoStampa 26.9' o 'ITMA Asia + CITME 2026 | Singapore' (o vacío)","banner_title":"título del banner (máx. 6 palabras)","hero_kicker":"antetítulo en mayúsculas (máx. 6 palabras, o vacío)","hero_title":"titular principal (máx. 10 palabras)","greeting":true,"paragraphs":["2-3 párrafos del cuerpo"],"section_title":"título de la sección secundaria (o vacío)","section_paragraphs":["0-2 párrafos"],"cta_title":"titular de la franja de CTA","cta_text":"1 frase bajo el titular (o vacío)","cta_label":"texto del botón (máx. 4 palabras)","cta_url":"URL del botón","secondary_text":"frase corta antes del enlace secundario (o vacío)","secondary_label":"texto del enlace secundario (o vacío)","secondary_url":"URL secundaria (o vacía)","signoff":["1 frase de cierre antes de la firma"]}
REGLAS: el saludo lo pone la plantilla ({{Recipient.FirstName}}), no lo incluyas en los párrafos. No incluyas la firma (la pone la plantilla). Para cta_url usa la URL que aparezca en el texto (artículo de la documentación, notas de versión, inedit.com); si no hay ninguna, usa "mailto:sales@inedit.com". Sin markdown ni emojis.
TEXTO:
${showText(post.content)}`;
}
async function createSfEmail(postIdx){
  if (S.busy || !S.sample) return;
  const post = S.thread[postIdx]; if (!post) return;
  const ctx = Object.assign({}, S.threadCtx || {}, {product: post.product});
  const msg = {role:"assistant", emailHtml:true, aux:true, pending:true, content:"", label:`HTML para Salesforce · ${PR[post.product]?.name || ""}`, forIdx:postIdx, product:post.product, channel:post.channel, type:post.type, lang: post.lang === "es" ? "es" : "en"};
  S.thread.push(msg); S.busy = true; render();
  try {
    const d = await S.sample.json(sfPrompt(post, ctx), {cache:false, modelTier:"default"});
    if (!d || !d.hero_title || !Array.isArray(d.paragraphs)) throw {code:"bad_shape"};
    d.lang = msg.lang;
    msg.data = d; msg.html = sfEmailHtml(d, post.product); msg.content = "ok";
  } catch(e){ msg.error = true; msg.content = e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : "No se ha podido crear el HTML. Vuelve a intentarlo."; }
  finally { msg.pending = false; S.busy = false; render(); }
}
async function sfDialogFromText(text, product, type, lang, channel, btn){
  if (!S.sample) return;
  if (btn) { btn.disabled = true; btn.textContent = "Maquetando…"; }
  try {
    const post = {content:text, product, type, lang: lang === "es" ? "es" : "en"};
    const d = await S.sample.json(sfPrompt(post, {type}), {cache:false, modelTier:"default"});
    if (!d || !d.hero_title || !Array.isArray(d.paragraphs)) throw {code:"bad_shape"};
    d.lang = post.lang;
    const m = {html: sfEmailHtml(d, product), data:d, product, type, lang:post.lang, channel, label:`HTML para Salesforce · ${PR[product]?.name || ""}`};
    const dlg = document.getElementById("dlg"), body = document.getElementById("dlgBody"); body.replaceChildren();
    dlg.style.width = "min(760px, calc(100vw - 24px))";
    const el = emailHtmlEl(m); el.querySelectorAll(".btn.ghost").forEach(b => { if (/Rehacer/.test(b.textContent)) b.remove(); });
    body.append(h("h3",null,"HTML para Salesforce"), el, h("div",{class:"row"}, h("button",{class:"btn", onclick:()=>{ dlg.close(); }}, "Cerrar")));
    dlg.addEventListener("close", () => { dlg.style.width = ""; }, {once:true});
    dlg.showModal();
  } catch(e){ toast(e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : "No se ha podido crear el HTML"); }
  finally { if (btn) { btn.disabled = false; btn.textContent = "HTML para Salesforce"; } }
}
function emailHtmlEl(m){
  const el = h("div",{class:"msg ai visual"});
  el.append(h("div",{class:"who", style:{padding:"12px 14px 0"}}, PR[m.product] ? picon(PR[m.product],"18px") : null, m.label));
  if (m.pending){ el.append(h("div",{class:"body", style:{padding:"10px 14px 14px"}}, "Maquetando el email en la plantilla de Salesforce…")); return el; }
  if (m.error){ el.append(h("div",{class:"body", style:{padding:"10px 14px 14px"}}, m.content), h("div",{class:"tools", style:{padding:"0 14px 12px", borderTop:"0"}}, h("button",{class:"btn small", disabled:S.busy, onclick:()=>createSfEmail(m.forIdx)}, "Reintentar"))); return el; }
  const fr = h("iframe",{title:"Vista previa del email", sandbox:"", style:{width:"100%", height:"640px", border:"0", background:"#fff", display:"block"}}); fr.srcdoc = m.html;
  el.append(h("div",{style:{padding:"10px 14px 0", fontSize:"13px"}}, h("strong",null,"Asunto: "), m.data.subject, h("br"), h("span",{style:{color:"var(--muted)"}}, "Vista previa: " + m.data.preheader)),
    h("div",{class:"stage", style:{padding:"10px"}}, fr),
    h("div",{class:"tools", style:{padding:"10px 12px", marginTop:"0"}},
      h("button",{class:"btn small primary", onclick:()=>copy(m.html)}, "Copiar HTML"),
      S.downloads ? h("button",{class:"btn small", onclick:async()=>{ try { await S.downloads.save({filename:`Inedit_${PR[m.product]?.name || "email"}_${(m.data.subject || "email").slice(0,40).replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_")}.html`, data:new Blob([m.html], {type:"text/html"})}); } catch(e){ if (!e || e.code !== "declined") toast("No se ha podido descargar"); } }}, "Descargar .html") : null,
      h("button",{class:"btn small", onclick:()=>copy(m.data.subject)}, "Copiar asunto"),
      h("button",{class:"btn small", onclick:()=>saveContent({title:"HTML Salesforce: " + (m.data.subject || ""), body:m.html, kind: m.type === "newsletter" ? "newsletter" : "email", channel:m.channel || "", product:m.product, lang:m.lang, source:"Plantilla Salesforce"})}, "Guardar en Contenidos"),
      h("button",{class:"btn small ghost", disabled:S.busy, onclick:()=>createSfEmail(m.forIdx)}, "Rehacer")),
    (() => { const bc = S.brandCfg || {}; const miss = !bc.emailLogoUrl || (m.product !== "inedit" && !bc["emailIcon_" + m.product]); return miss ? h("div",{class:"notice", style:{margin:"0 14px 10px"}}, "Faltan las URLs públicas de los logos para emails (Fiery | Inèdit y el del producto): ahora salen como texto. Añádelas en Kit de marca › Logos para emails.", " ", h("button",{class:"btn small", onclick:()=>go("brand")}, "Ir al kit de marca")) : null; })(),
    h("div",{style:{padding:"0 14px 12px", fontSize:"12px", color:"var(--muted)"}}, "Plantilla de la casa (PRINTING United) con el color del producto. Incluye {{Recipient.FirstName}}, {{Unsubscribe}} y {{EmailPreferenceCenter}}. Revisa los enlaces antes de enviar."));
  return el;
}

function linkedContent(i){ return i && i.id ? S.content.find(c => c.itemId === i.id || (i.contentId && c.id === i.contentId)) : null; }
function previewAsset(i){
  if (!i) return "";
  if (i.designAssetId) return i.designAssetId;
  if (i.fileAssetId && /^image\//.test(i.fileType || "")) return i.fileAssetId;
  const c = linkedContent(i);
  if (c) return c.designAssetId || (c.fileAssetId && /^image\//.test(c.fileType || "") ? c.fileAssetId : "");
  return "";
}
function designLinks(i){ const c = linkedContent(i) || {}; return {claude: i.designUrl || c.designUrl || "", canva: i.canvaUrl || c.canvaUrl || ""}; }
async function uploadPreview(file, ref, label){
  if (!S.assets) { toast("No se pueden subir imágenes en esta vista"); return false; }
  if (!/^image\//.test(file.type)) { toast("Usa una imagen (PNG, JPG, WEBP o SVG). Si es un PDF, exporta el diseño como PNG."); return false; }
  try {
    toast("Subiendo la vista previa…");
    const up = await S.assets.upload(file.name ? file : new File([file], "diseno.png", {type:file.type}));
    ref.designAssetId = up.id; ref.visualSvg = null;
    if (S.db) await S.db.collection("library").add({category:"disenos", name:(label || "Diseño").slice(0,60) + ".png", assetId:up.id, contentType:up.contentType || file.type, size:up.sizeBytes || file.size, url: ref.designUrl || ref.canvaUrl || "", createdAt:Date.now(), updatedAt:Date.now()});
    toast("Vista previa añadida. Pulsa Guardar para conservarla en la pieza.");
    return true;
  } catch(e){ toast(`No se ha podido subir la imagen${e && e.code ? " (" + e.code + ")" : ""}`); return false; }
}

    const fi = h("input",{type:"file", accept:"image/*", style:{display:"none"}, onchange:async e=>{ const f = e.target.files[0]; if (f && await uploadPreview(f, ref, labelFn())) draw(); }});
    const linkBtns = () => [links.claude ? h("a",{class:"btn small", href:links.claude, target:"_blank", rel:"noopener"}, "Abrir en Claude Design") : null, links.canva ? h("a",{class:"btn small", href:links.canva, target:"_blank", rel:"noopener"}, "Abrir en Canva") : null];
    const badges = () => [links.claude ? h("span",{class:"pbadge", style:{background:"#D97757"}}, "Claude Design") : null, links.canva ? h("span",{class:"pbadge", style:{background:"#7D2AE8"}}, "Canva") : null];

async function ctGenerate(){
  const c = S.ct; if (!S.sample || c.busy) return;
  c.fields = c.fields.filter(f => f.name.trim() && f.limit > 0);
  if (!c.fields.length) { toast("Añade al menos un campo"); return; }
  c.busy = true; render();
  try {
    const data = await S.sample.json(ctPrompt(c), {cache:false, modelTier:"default"});
    if (!data || !Array.isArray(data.fields)) throw {code:"bad_shape"};
    c.out = c.fields.map((f, i) => ({name:f.name, limit:f.limit, en:(data.fields[i] && data.fields[i].en) || "", es:(data.fields[i] && data.fields[i].es) || ""}));
    c.tab = c.lang === "es" ? "es" : "en";
    const over = c.out.filter(f => ["en","es"].some(l => nchars(f[l]) > f.limit)).length;
    toast(over ? `Listo. ${over} campo(s) pasan del límite: usa "Acortar".` : "Listo. Todos los campos están dentro del límite.");
  } catch(e){ toast(e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : "No se han podido generar los textos. Vuelve a intentarlo."); }
  finally { c.busy = false; render(); }
}
async function ctShorten(i, lang){
  const c = S.ct, f = c.out[i]; if (!S.sample || c.busy) return;
  c.busy = true; render();
  try {
    let text = f[lang];
    for (let attempt = 0; attempt < 2 && nchars(text) > f.limit; attempt++){
      const target = Math.floor(f.limit * (attempt ? 0.8 : 0.9));
      const res = await S.sample(`Acorta este texto a un máximo de ${target} caracteres contando espacios (ahora tiene ${nchars(text)}). Mantén el idioma, los datos concretos y el tono profesional; elimina lo menos importante y no añadas nada nuevo. Devuelve solo el texto acortado, sin comillas ni comentarios.\n\n${text}`, {cache:false, modelTier:"quick"});
      const out = String(res.text || "").trim().replace(/^["“]|["”]$/g, "");
      if (out) text = out;
    }
    if (nchars(text) > f.limit){
      // last resort: cut at the last full sentence that fits
      const chars = [...text].slice(0, f.limit).join("");
      const cut = Math.max(chars.lastIndexOf(". "), chars.lastIndexOf(".\n"));
      text = cut > f.limit * 0.5 ? chars.slice(0, cut + 1) : chars.trim();
    }
    f[lang] = text;
    toast(`Acortado a ${nchars(text)} caracteres`);
  } catch(e){
    toast(e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : e && e.code === "not_granted" ? "Sin permiso para usar Claude en esta página." : `No se ha podido acortar${e && e.code ? " (" + e.code + ")" : ""}`);
  } finally { c.busy = false; render(); }
}

async function pickLogo(product){

    const ratio = await new Promise(res => { const im = new Image(); im.onload = () => res(im.naturalWidth / Math.max(1, im.naturalHeight)); im.onerror = () => res(3); im.src = url; });

    h("div",{class:"actions"}, h("button",{class:"btn ghost", onclick:()=>{ S.rel = relBlank(); render(); }}, "Nueva versión"))));
  if (S.sample === null && S.dbReady) wrap.append(h("div",{class:"notice"},"El redactor no está disponible en esta vista. Abre la página publicada en claude.ai con tu cuenta."));
  const grid = h("div",{class:"rel"});

  // form
  const f = h("div",{class:"form"});
  const prod = h("select",{onchange:e=>{ r.product = e.target.value; render(); }}, Object.entries(PRODUCTS).map(([k,p]) => h("option",{value:k, selected:r.product===k}, p.name)));
  const ver = h("input",{type:"text", value:r.version, placeholder:"26.10", oninput:e=>{ r.version = e.target.value.trim(); }});
  const dt = h("input",{type:"date", value:r.date, oninput:e=>{ r.date = e.target.value; }});
  f.append(h("div",{class:"grid3"}, h("label",null,"Producto", prod), h("label",null,"Versión", ver), h("label",null,"Fecha", dt)));
  const raw = h("textarea",{class:"raw", placeholder:"Pega aquí las notas de Producto, tal como llegan (en inglés, español o mezcla). Las correcciones de errores se apartan automáticamente.", oninput:e=>{ r.raw = e.target.value; }}); raw.value = r.raw;
  f.append(h("label",null,"Notas en bruto", raw));
  const imgs = h("textarea",{placeholder:"https://…/captura.png | Texto alternativo", style:{minHeight:"64px"}, oninput:e=>{ r.imagesText = e.target.value; }}); imgs.value = r.imagesText;
  f.append(h("label",null,"Imágenes (opcional): una URL por línea; añade | y una descripción", imgs));

  // requirements
  const cfg = reqFor(r.product);
  const det = h("details",null, h("summary",null,"Requisitos técnicos de " + PRODUCTS[r.product].name + " (se reutilizan en cada versión)"));
  const reqBox = h("div",{class:"req"});
  const fields = r.product === "neostampa" ? [["os","Sistema operativo"],["langs","Idiomas"]] : [["os","Sistema operativo"],["adobe","Adobe"],["langs","Idiomas"]];
  const edits = {en:{...cfg.en}, es:{...cfg.es}};
  ["en","es"].forEach(lg => fields.forEach(([k,lab]) => {
    const t = h("textarea",{oninput:e=>{ edits[lg][k] = e.target.value; }}); t.value = cfg[lg][k] || "";
    reqBox.append(h("label",null, `${lab} · ${lg === "en" ? "inglés" : "español"}`, t));
  }));
  reqBox.append(h("p",{class:"empty", style:{margin:"0", fontSize:"12px"}}, "Escribe [Título] en una línea para ponerlo en negrita y {NOTA:} para cursiva. Una línea vacía separa bloques."));
  reqBox.append(h("button",{class:"btn small", disabled:!S.db, onclick:async()=>{
    try { await S.db.collection("config").doc("req-" + r.product).set({en:edits.en, es:edits.es, updatedAt:Date.now()}); toast("Requisitos guardados"); }
    catch(e){ toast("No se han podido guardar los requisitos"); } }}, "Guardar requisitos"));
  det.append(reqBox); f.append(det);

  f.append(h("div",{class:"row", style:{display:"flex", gap:"8px", justifyContent:"flex-end"}},
    r.busy ? h("span",{class:"hint", style:{marginRight:"auto", fontSize:"12.5px", color:"var(--muted)"}}, "Redactando en inglés y español…") : null,
    h("button",{class:"btn primary", disabled: r.busy || !S.sample, onclick:generateRelease}, r.data ? "Volver a generar" : "Generar notas de versión")));
  grid.append(f);

  // output
  const out = h("div",{class:"out"});
  if (!r.data){
    out.append(h("p",{class:"empty"}, r.busy ? "Redactando…" : "Aquí verás la vista previa en inglés y español, lista para copiar en WordPress."));
  } else {
    const html = buildReleaseHtml(Object.assign({}, r, {req: reqFor(r.product)}), r.lang);
    const tabs = h("div",{class:"tabs", role:"tablist"}, ["en","es"].map(lg => h("button",{role:"tab", "aria-selected": r.lang===lg ? "true":"false", onclick:()=>{ r.lang = lg; render(); }}, lg === "en" ? "Inglés" : "Español")));
    const fname = `${PRODUCTS[r.product].name}_${r.version || "version"}_${r.lang.toUpperCase()}.html`;
    out.append(h("div",{class:"bar"}, tabs,
      h("button",{class:"btn small", onclick:()=>copy(html)}, "Copiar HTML"),
      S.downloads ? h("button",{class:"btn small", onclick:async()=>{ try { await S.downloads.save({filename:fname, data:new Blob([html],{type:"text/html"})}); } catch(e){ if (e && e.code !== "declined") toast("No se ha podido descargar"); } }}, "Descargar .html") : null,
      h("button",{class:"btn small", disabled:!S.db, onclick:()=>saveContent({title:`Notas de versión ${PRODUCTS[r.product].name} ${r.version} (${r.lang.toUpperCase()})`, body:html, kind:"nota", product:r.product, lang:r.lang, source:"Notas de versión"})}, "Guardar en Contenidos"),
      h("button",{class:"btn small primary", disabled:!S.db, onclick:saveRelease}, r.id ? "Guardar cambios" : "Guardar versión")));
    const fr = h("iframe",{title:"Vista previa", sandbox:""}); fr.srcdoc = html; out.append(fr);
    if ((r.images||[]).length) out.append(h("p",{class:"empty", style:{fontSize:"12px", margin:"6px 0 0"}}, "Las imágenes externas no se muestran en esta vista previa, pero sí en WordPress."));
    const ex = (r.data.excluded || []);
    if (ex.length){
      const box = h("div",{class:"excl"}, h("h4",null, `Correcciones apartadas (${ex.length})`),
        h("p",{class:"small"}, "No aparecen en las notas. Si alguna aporta un beneficio claro, puedes incluirla redactada como mejora."));
      ex.forEach((x, i) => {
        const can = !!(x.as_enhancement_en && x.as_enhancement_es);
        const cb = h("input",{type:"checkbox", disabled:!can, checked: !!(r.data._included||[]).includes(x)});
        cb.addEventListener("change", () => { r.data._included = (r.data._included||[]).filter(y => y !== x); if (cb.checked) r.data._included.push(x); render(); });
        box.append(h("label",null, cb, h("span",null, h("s",null, x.original), can ? h("span",null, h("br"), "→ ", r.lang === "en" ? x.as_enhancement_en : x.as_enhancement_es) : h("span",{style:{color:"var(--muted)"}}, " · sin beneficio para el usuario"))));
      });
      out.append(box);
    }
    const qs = (r.data.open_questions || []).filter(Boolean);
    if (qs.length) out.append(h("div",{class:"qs"}, h("strong",null,"Preguntas abiertas para Producto"), h("ul",null, qs.map(q => h("li",null,q)))));
    if (r.id) out.append(h("div",{style:{marginTop:"14px", display:"flex", gap:"8px", flexWrap:"wrap"}},
      h("button",{class:"btn small", disabled:!S.db, onclick:()=>addDerived(r)}, "Añadir piezas de lanzamiento al calendario")));
  }
  grid.append(out);
  wrap.append(grid);

  // history
  const sec = h("div",{class:"list"}, h("h3",null,"Versiones guardadas"));
  if (!S.releases.length) sec.append(h("p",{class:"empty"},"Todavía no hay versiones guardadas."));
  else {
    const tb = h("tbody",null);
    S.releases.forEach(x => tb.append(h("tr",null,
      h("td",null, PRODUCTS[x.product]?.name || x.product),
      h("td",null, h("button",{class:"link", onclick:()=>{ S.rel = Object.assign(relBlank(), x, {busy:false, lang:"en"}); if (S.rel.data){ S.rel.data = Object.assign({}, S.rel.data); S.rel.data.excluded = (S.rel.data.excluded||[]).map(e=>Object.assign({},e)); S.rel.data._included = (x.data.includedIdx||[]).map(i=>S.rel.data.excluded[i]).filter(Boolean); } render(); window.scrollTo(0,0); }}, x.version)),
      h("td",null, fmtDate(x.date)),
      h("td",null, h("button",{class:"btn small ghost danger", onclick:async()=>{ if (!(await askConfirm(`¿Eliminar las notas de ${PRODUCTS[x.product]?.name} ${x.version}?`))) return; try { await S.db.collection("releases").doc(x.id).delete(); if (S.rel && S.rel.id === x.id) S.rel = relBlank(); toast("Versión eliminada"); } catch(e){ toast("No se ha podido eliminar"); } }}, "Eliminar")))));
    sec.append(h("div",{class:"tablewrap"}, h("table",{class:"table"}, h("thead",null, h("tr",null, h("th",null,"Producto"), h("th",null,"Versión"), h("th",null,"Fecha"), h("th",null,""))), tb)));
  }
  wrap.append(sec);
  return wrap;
}
function reqFor(product){
  const c = S.reqCfg && S.reqCfg[product];
  return c ? {en:Object.assign({}, REQ_DEFAULT[product].en, c.en), es:Object.assign({}, REQ_DEFAULT[product].es, c.es)} : REQ_DEFAULT[product];
}
function parseImages(t){ return String(t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l => { const [url, ...alt] = l.split("|"); return {url:url.trim(), alt:alt.join("|").trim()}; }).filter(i => /^https?:\/\//.test(i.url)); }
async function generateRelease(){
  const r = S.rel;
  if (!S.sample || r.busy) return;
  if (!r.version) { toast("Indica la versión"); return; }
  if (!r.raw.trim()) { toast("Pega las notas en bruto"); return; }
  r.images = parseImages(r.imagesText);
  r.busy = true; render();
  try {
    const data = await S.sample.json(REL_PROMPT(r), {cache:false, modelTier:"default"});
    if (!data || !Array.isArray(data.sections)) throw {code:"bad_shape"};
    data.excluded = Array.isArray(data.excluded) ? data.excluded : [];
    data._included = [];
    r.data = data; r.lang = "en";
    toast(data.excluded.length ? `Listo. ${data.excluded.length} corrección(es) apartada(s).` : "Listo");
  } catch(e){
    toast(e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un minuto." : e && e.code === "not_granted" ? "Sin permiso para usar Claude en esta página." : "No se han podido generar las notas. Vuelve a intentarlo.");
  } finally { r.busy = false; render(); }
}
async function saveRelease(){
  const r = S.rel; if (!S.db || !r.data) return;
  const included = (r.data._included || []).map(x => r.data.excluded.indexOf(x)).filter(i => i >= 0);
  const data = Object.assign({}, r.data); delete data._included; data.includedIdx = included;
  const doc = {product:r.product, version:r.version, date:r.date, raw:r.raw, imagesText:r.imagesText, images:r.images, data, updatedAt:Date.now()};
  try {
    if (r.id) await S.db.collection("releases").doc(r.id).set(Object.assign({createdAt: r.createdAt || Date.now()}, doc));
    else { doc.createdAt = Date.now(); const ref = await S.db.collection("releases").add(doc); r.id = ref.id; r.createdAt = doc.createdAt; }
    toast("Versión guardada"); render();
  } catch(e){ toast("No se ha podido guardar la versión"); }
}
async function addDerived(r){
  const name = `${PRODUCTS[r.product].name} ${r.version}`;
  const base = r.date ? parseYmd(r.date) : new Date();
  const at = n => ymd(new Date(base.getFullYear(), base.getMonth(), base.getDate() + n));
  const summary = (r.data.sections||[]).flatMap(sx => (sx.items||[]).map(i => "- " + (i.en || i.es))).slice(0,12).join("\n");
  const pieces = [
    {channel:"website", date:at(0), title:`Publicar notas de versión ${name} (EN y ES)`},
    {channel:"linkedin", date:at(1), title:`Post de lanzamiento: ${name}`},
    {channel:"meta", date:at(2), title:`Post corto de lanzamiento: ${name}`},
    {channel:"youtube", date:at(7), title:`Vídeo demo de la novedad principal de ${name}`}
  ];
  if (!(await askConfirm(`Se añadirán ${pieces.length} piezas al calendario como "Idea" (web, LinkedIn, Meta y YouTube). ¿Continuar?`, "Añadir"))) return;
  try {
    for (const p of pieces) await S.db.collection("items").add(Object.assign(p, {status:"idea", product:r.product, lang:"en", body:`Basado en las notas de versión de ${name}:\n${summary}`, createdAt:Date.now(), updatedAt:Date.now()}));
    toast("Piezas añadidas al calendario");
  } catch(e){ toast("No se han podido añadir las piezas"); }
}
function releasesContext(){
  const rs = S.releases.slice(0,3);
  if (!rs.length) return "";
  return "\n\nÚLTIMAS NOTAS DE VERSIÓN GUARDADAS (fuente válida; no incluyen correcciones de errores):\n" + rs.map(x => `${PRODUCTS[x.product]?.name} ${x.version} (${x.date || "sin fecha"}):\n` + ((x.data && x.data.sections) || []).flatMap(sx => (sx.items||[]).map(i => "- " + (sx.module ? sx.module + ": " : "") + (i.en || i.es))).slice(0,10).join("\n")).join("\n");
}

document.getElementById("dlg").addEventListener("close", () => { document.getElementById("dlg").onpaste = null; });
new MutationObserver(muts => { if (S.uiLang !== "en" && !S._wasEn) return; for (const m of muts) m.addedNodes.forEach(n => trNode(n)); }).observe(document.body, {childList:true, subtree:true});
applyTheme(S.theme);
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ((S.theme || "auto") === "auto") renderRail(); }); } catch(e){}
try { if (localStorage.getItem("ics-rail-mini") === "1") document.body.classList.add("rail-mini"); } catch(e){}
document.getElementById("scrim").addEventListener("click", () => setNavOpen(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("nav-open")) setNavOpen(false); });
/* ---------- Boot ---------- */
renderRail(); render(); setFoot();
(async () => {
  const use = window.claude && window.claude.use ? n => window.claude.use(n).catch(()=>null) : async () => null;
  const [db, sample, assets, user, downloads, mcp] = await Promise.all([use("db"), use("sample"), use("assets"), use("user"), use("downloads"), use("mcp")]);
  S.db = db; S.sample = sample; S.assets = assets; S.user = user; S.downloads = downloads; S.mcp = mcp; S.dbReady = true;
  loadDashRemote();
  setFoot();
  if (db){
    const sub = (path, field, key) => db.collection(path).orderBy(field, field === "date" ? "asc" : "desc").onSnapshot(
      snap => { const rows = snap.docs.map(d => Object.assign({id:d.id}, d.data())); S[key] = key === "sales" ? dedupSales(rows) : rows; S.ready[key] = true; rerenderIfNotCommand(); },
      () => { toast("Se ha perdido la conexión con el almacenamiento. Recarga la página."); });
    sub("items","date","items"); sub("library","createdAt","library"); sub("ideas","createdAt","ideas"); sub("releases","createdAt","releases"); sub("companytexts","updatedAt","companyTexts"); sub("models","createdAt","models"); sub("metrics","date","metrics"); sub("reports","createdAt","reports"); sub("content","updatedAt","content"); sub("folders","createdAt","folders"); sub("designreq","createdAt","designReqs"); sub("sales","date","sales");
    db.collection("config").onSnapshot(snap => { const c = {}; snap.docs.forEach(d => { if (d.id.startsWith("req-")) c[d.id.slice(4)] = d.data(); if (d.id === "brandkit") S.brandCfg = d.data(); if (d.id === "knowledge") S.knowledge = d.data(); if (d.id === "metrics") S.metricsCfg = d.data(); if (d.id === "sales-targets") S.salesTargets = d.data(); if (d.id === "i18n-en") { const m = d.data().map; if (m) { S.i18n = m; S._rev = null; } } }); S.reqCfg = c; setFoot(); if (S.uiLang === "en") trNode(document.body); if (S.view === "releases" || (S.view === "results" && S.resTab === "ventas" && !document.activeElement?.matches?.("input,select,textarea"))) render(); }, () => {});
  }
  render();
  if (db) loadDocs();
})();
})();
